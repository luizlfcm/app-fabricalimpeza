function _fapApplyPerms(perms){
  try{localStorage.removeItem('fap_ess');}catch(e){}
  localStorage.setItem('fap_perms',JSON.stringify(perms));
  localStorage.removeItem('fap_preview');
  localStorage.removeItem('fap_buy_intent');
  S.preview=false;
  S.access={base:perms.base||false,limp:perms.limp||false,leg:perms.leg||false,form:perms.form||false,perf:perms.perf||false,full:false,admin:false};
  var el=document.getElementById('fap-login');if(el)el.remove();
  var ap=document.getElementById('app');if(ap)ap.removeAttribute('hidden');
  render();
  var standalone=window.matchMedia('(display-mode:standalone)').matches||navigator.standalone;
  if(!standalone&&!localStorage.getItem('fap_inst_shown')){setTimeout(openInst,1500);localStorage.setItem('fap_inst_shown','1');}
}

  _fapShowLogin();
}

function _fapDoLogin(){
  var btn=document.getElementById('fap-eb'),ee=document.getElementById('fap-ee'),ei=document.getElementById('fap-ei');
  var email=(ei?ei.value:'').trim().toLowerCase();
  if(!email){if(ee)ee.textContent='Digite seu email';return;}
  if(btn){btn.textContent='Verificando...';btn.disabled=true;}
  if(ee)ee.textContent='';
  fetch('/api/login?email='+encodeURIComponent(email),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.success){
        localStorage.setItem('fap_email',email);
        _fapApplyPerms(d.permissions);
      }else{
        if(ee)ee.textContent=d.error||'Email não encontrado';
        if(btn){btn.textContent='Acessar →';btn.disabled=false;}
      }
    })
    .catch(function(){
      if(ee)ee.textContent='Erro de conexão. Tente novamente.';
      if(btn){btn.textContent='Acessar →';btn.disabled=false;}
    });
}

function _fapBgRefresh(){
  var email=localStorage.getItem('fap_email');
  if(!email)return;
  fetch('/api/login?email='+encodeURIComponent(email),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.success){
        localStorage.setItem('fap_perms',JSON.stringify(d.permissions));
        S.access={base:d.permissions.base||false,limp:d.permissions.limp||false,leg:d.permissions.leg||false,form:d.permissions.form||false,perf:d.permissions.perf||false,full:false,admin:false};
        render();
      }else{
        localStorage.removeItem('fap_email');
        localStorage.removeItem('fap_perms');
      }
    })
    .catch(function(){});
}

function parseAccess(){
  var p=new URLSearchParams(location.search);
  var t=(p.get('t')||p.get('access')||'').toUpperCase();
  if(t==='ADMIN_FDL_2026'||t.includes('FULL'))
    return{base:true,limp:true,leg:true,form:true,perf:true,full:true,admin:true};
  var saved=localStorage.getItem('fap_perms');
  if(saved){try{var pr=JSON.parse(saved);return{base:pr.base||false,limp:pr.limp||false,leg:pr.leg||false,form:pr.form||false,perf:pr.perf||false,full:false,admin:false};}catch(e){}}
  return{base:false,limp:false,leg:false,form:false,perf:false,full:false,admin:false};
}

var ESS=null,ESSUPG=null,_essTimer=null;
(function(){try{
  var q=new URLSearchParams(location.search),em=(q.get('email')||'').trim().toLowerCase();
  if(q.get('from')==='ess'&&/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ESS={email:em};localStorage.setItem('fap_ess',JSON.stringify(ESS));}
  else{var sv=localStorage.getItem('fap_ess');if(sv)ESS=JSON.parse(sv);}
}catch(e){ESS=null;}})();
function _essUrl(){return 'https://pagamento.luverisgroup.com.br/'+ESS_CFG.p+'/upg?email='+encodeURIComponent(ESS.email)+'&utm_source=app&utm_medium=previa&utm_content=upg';}
function _essBrl(v){return 'R$ '+Number(v).toFixed(2).replace('.',',');}
function _essLeft(){
  var ms=ESSUPG?Number(ESSUPG.expiraEm)-Date.now():0;
  if(ms<=0)return'';
  var h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);
  return (h>=24?Math.floor(h/24)+'d ':'')+(h%24)+'h '+('0'+m).slice(-2)+'min';
}
function _essTick(){
  if(_essTimer)clearInterval(_essTimer);
  _essTimer=setInterval(function(){
    if(!ESSUPG){clearInterval(_essTimer);return;}
    if(Number(ESSUPG.expiraEm)-Date.now()<=0){ESSUPG=null;CHECKOUT_BASE=CHECKOUT_URLS.base=_ESS_BASE0;clearInterval(_essTimer);if(S.preview)render();return;}
    var e=document.getElementById('ess-left');if(e)e.textContent=_essLeft();
  },20000);
}
var _ESS_BASE0=CHECKOUT_URLS.base;
function _essLoad(){
  if(!ESS)return;
  fetch('https://pagamento.luverisgroup.com.br/api/upgrade?p='+ESS_CFG.p+'&email='+encodeURIComponent(ESS.email),{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(d&&d.naJanela&&Number(d.expiraEm)>Date.now()){ESSUPG=d;CHECKOUT_BASE=CHECKOUT_URLS.base=_essUrl();_essTick();}
      if(S.preview)render();
    }).catch(function(){});
}
_essLoad();

function go(view,extra={}){
  Object.assign(S,{view},extra);
  render();
  window.scrollTo(0,0);
  updNav();
}
function updNav(){
  document.querySelectorAll('.ni').forEach(el=>
    el.classList.toggle('on', el.dataset.v===S.view));
}
function isFav(id){return S.favs.includes(id);}
function isVd(id){return S.viewed.includes(id);}
function togFav(id,e){
  if(e){e.stopPropagation();}
  S.favs=isFav(id)?S.favs.filter(x=>x!==id):[...S.favs,id];
  sv('fap_fav',S.favs);
  render();
}
function markVd(id){
  if(!isVd(id)){S.viewed=[...S.viewed,id];sv('fap_viewed',S.viewed);}
}
function updProg(){
  const t=AF.length+LF.length,d=S.viewed.length,pf=$('pf');
  if(pf)pf.style.width=(t>0?d/t*100:0)+'%';
}

function bindSearch(){
  const inp=$('search-inp');
  if(!inp)return;
  inp.focus();
  // Restore previous search
  if(S.searchQ){inp.value=S.searchQ;doSearch(S.searchQ);}
  inp.addEventListener('input',e=>{
    const q=e.target.value;
    S.searchQ=q;
    doSearch(q);
  });
  inp.addEventListener('keydown',e=>{
    // Force cursor to end on each keystroke (RTL fix)
    requestAnimationFrame(()=>{
      if(inp.selectionStart!==inp.value.length){
        // Don't force if user is editing middle of text
      }
    });
  });
}
function doSearch(q){
  const el=$('search-results');
  if(!el)return;
  const qn=q.toLowerCase().trim();
  if(qn.length<2){
    el.innerHTML='<div class="es"><div class="ei">🔍</div><div class="et">Digite para buscar</div><div class="ex2">Mínimo 2 caracteres</div></div>';
    return;
  }
  const all=[...AF,...LF,...PF];
  const rs=all.filter(f=>
    f.title.toLowerCase().includes(qn)||
    f.desc.toLowerCase().includes(qn)||
    (f.catName||'').toLowerCase().includes(qn)||
    (f.uses||[]).some(u=>u.toLowerCase().includes(qn))
  );
  if(!rs.length){
    el.innerHTML='<div class="es"><div class="ei">😔</div><div class="et">Nenhum resultado</div><div class="ex2">Tente outros termos</div></div>';
    return;
  }
  el.innerHTML=`<div class="fl">${rs.map(f=>{
    const isAuto=AF.includes(f);
    const isLimp=LF.includes(f);
    const isPerf=PF.includes(f);
    const act=isPerf?'perf-form':(isLimp?'limp-form':'auto-form');
    return`<div class="fi${isFav(f.id)?' sv':''}" data-action="${act}" data-id="${f.id}" data-cat="${f.cat}">
      <div class="fic">
        <div style="font-size:10px;color:var(--acc);margin-bottom:2px;font-weight:700">${f.catIcon||''} ${f.catName||''}</div>

        <div class="fid">${f.desc}</div>

  }).join('')}</div>`;
  bindCommon();
}

// ── EVENT BINDING ──────────────────────────────────────────────────
function bindCommon(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    // Avoid double-binding
    if(el._bound)return;
    el._bound=true;
    el.addEventListener('click',handleClick);
  });
  const gi=$('gi');
  if(gi)gi.addEventListener('input',e=>{
    const q=e.target.value.toLowerCase();
    document.querySelectorAll('#gb tr').forEach(r=>{
      r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';
    });
  });
}

function handleClick(e){
  const el=e.currentTarget,ac=el.dataset.action;
  switch(ac){
    case'go': go(el.dataset.v);break;
    case'upsell': {
      const key=el.dataset.key;
      if(key&&!S.access[key]&&CHECKOUT_URLS[key]){
        _fapPixel('InitiateCheckout',{content_name:key});
        window.open(CHECKOUT_URLS[key],'_blank');
      }
      break;
    }
    case'track-checkout': {
      _fapPixel('InitiateCheckout',{content_name:el.dataset.produto||''});
      try{localStorage.setItem('fap_buy_intent','1');}catch(e){}
      setTimeout(function(){if(S.preview)render();},400);
      break; // navegação padrão do <a href target=_blank> acontece normalmente
    }
    case'download-pdf': {
      const produto=el.dataset.produto;
      const hasAcc=S.access[produto]||S.access.admin;
      if(!hasAcc){
        alert('Esse PDF fica disponível depois da compra. Desbloqueie o acesso completo para baixar.');
        return;
      }
      const prevTxt=el.textContent;
      el.textContent='Baixando...';el.disabled=true;
      const email=localStorage.getItem('fap_email')||'';
      const tk=S.access.admin?'ADMIN_FDL_2026':'';
      fetch('/api/download?produto='+encodeURIComponent(produto)+'&email='+encodeURIComponent(email)+(tk?'&token='+tk:''),{cache:'no-store'})
        .then(function(r){ if(!r.ok)throw new Error('fail'); return r.blob(); })
        .then(function(blob){
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');
          a.href=url;a.download=PDF_NAMES[produto]||'documento.pdf';
          document.body.appendChild(a);a.click();a.remove();
          setTimeout(function(){URL.revokeObjectURL(url);},2000);
          el.textContent=prevTxt;el.disabled=false;
        })
        .catch(function(){
          alert('Não foi possível baixar agora. Tente novamente ou fale com o suporte.');
          el.textContent=prevTxt;el.disabled=false;
        });
      break;
    }
    case'auto-cat': go('auto-cat',{autoCat:el.dataset.cat});break;
    case'auto-form': go('auto-form',{autoForm:el.dataset.id,autoCat:el.dataset.cat||S.autoCat});break;
    case'limp-cat': go('limp-cat',{limpCat:el.dataset.cat});break;
    case'limp-form': go('limp-form',{limpForm:el.dataset.id,limpCat:el.dataset.cat||S.limpCat});break;
    case'perf-cat': go('perf-cat',{perfCat:el.dataset.cat});break;
    case'perf-form': go('perf-form',{perfForm:el.dataset.id,perfCat:el.dataset.cat||S.perfCat});break;
    case'leg-cap': go('legal-cap',{legCap:el.dataset.id});break;
    case'back-cat': go(el.dataset.view,{autoCat:el.dataset.cat,limpCat:el.dataset.cat,perfCat:el.dataset.cat});break;
    case'fav': togFav(el.dataset.id,e);break;
    case'ip-tab': S.instTab=el.dataset.tab;S._instTabManual=true;renderInstTabs();break;
  }
}

async function installNativo(){

  const escolha=await dP.userChoice;
  if(escolha.outcome==='accepted'){
    closeInst();
  }
  dP=null;

function detectaNavegadorApp(){
  const ua=navigator.userAgent||'';
  const isInstagram=/Instagram/i.test(ua);
  const isFacebook=/FBAN|FBAV|FB_IAB/i.test(ua);
  const isWhatsApp=/WhatsApp/i.test(ua);
  const isLine=/Line\//i.test(ua);
  const isTikTok=/TikTok|BytedanceWebview/i.test(ua);
  if(isInstagram)return'Instagram';
  if(isFacebook)return'Facebook';
  if(isWhatsApp)return'WhatsApp';
  if(isTikTok)return'TikTok';
  if(isLine)return'Line';
  return null;
}

function renderInstTabs(){
  const box=$('ip-box');
  if(!box)return;

  // Se o navegador oferece instalação nativa (Android/Chrome/Edge), mostra botão de 1 toque
  if(dP){
    box.innerHTML=`
    <div class="ip-title">📲 Instalar no Celular</div>
    <div class="ip-sub">Acesse offline, sem internet, igual a um app</div>
    <div style="text-align:center;padding:24px 0 8px">
      <div style="font-size:44px;margin-bottom:14px">⚡</div>
      <p style="font-size:13px;color:var(--mut);margin-bottom:18px">Seu navegador já suporta instalação com 1 toque.</p>
    </div>
    <button class="ip-close" style="background:linear-gradient(135deg,var(--acc),var(--acd));color:#fff;border:none;font-weight:700;margin-bottom:10px" onclick="installNativo()">📲 Instalar Agora</button>
    <button class="ip-close" onclick="closeInst()">Agora não</button>`;
    return;
  }

  // Sem prompt nativo disponível — mostra passo a passo (obrigatório no iPhone/Safari)
  const ios=S.instTab==='ios';
  const appDetectado=detectaNavegadorApp();
  const avisoAppInterno=(ios&&appDetectado)?`
    <div style="background:rgba(232,114,12,.12);border:1px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:16px;text-align:left">
      <div style="font-size:12px;font-weight:800;color:var(--acl);margin-bottom:6px">⚠️ Você está no navegador do ${appDetectado}</div>
      <div style="font-size:12px;color:var(--txt);line-height:1.5">O ${appDetectado} não permite instalar apps. Toque nos <b>●●●</b> ou <b>⋯</b> (menu, geralmente no canto superior direito) e escolha <b>"Abrir no Safari"</b> ou <b>"Abrir no navegador"</b> antes de continuar.</div>

function init(){
  S.access=parseAccess();
  setTimeout(function(){
    var sp=document.getElementById('splash'),ap=document.getElementById('app');
    if(sp){sp.style.opacity='0';sp.style.transition='opacity .5s';}
    setTimeout(function(){
      if(sp)sp.style.display='none';
      // Sem acesso — mostra tela de login OU retoma/inicia o Modo Prévia
      if(!S.access.base&&!S.access.admin){
        var pParams=new URLSearchParams(location.search);
        if(!S.preview&&pParams.get('preview')==='1'){
          // Chegou direto de um link "conheça a plataforma" (ex: da PV) — pula a tela de escolha
          _fapStartPreview();
          return;
        }
        if(S.preview){
          if(ap)ap.removeAttribute('hidden');
          render();
          _fapPixel('ViewContent',{content_name:'Fábrica da Limpeza - Modo Prévia',content_category:'preview_mode'});
          setTimeout(_fapBgRefresh,1000);
          return;
        }
        _fapShowLogin();
        return;
      }
      if(ap)ap.removeAttribute('hidden');
      render();
      var standalone=window.matchMedia('(display-mode:standalone)').matches||navigator.standalone;
      if(!standalone&&!localStorage.getItem('fap_inst_shown')){
        setTimeout(openInst,1500);
        localStorage.setItem('fap_inst_shown','1');
      }
      // Background refresh — atualiza permissões sem bloquear nada
      setTimeout(_fapBgRefresh,1000);
    },520);
  },2000);
  document.querySelectorAll('.ni').forEach(el=>{
    el.addEventListener('click',()=>{const v=el.dataset.v;if(v)go(v);});
  });
  $('hdr-logo')?.addEventListener('click',()=>go('home'));
  $('hdr-s-btn')?.addEventListener('click',()=>go('search'));
  $('hdr-f-btn')?.addEventListener('click',()=>go('favs'));
  $('hdr-inst-btn')?.addEventListener('click',openInst);
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
document.addEventListener('DOMContentLoaded',init);

s produtos","misturar desinfetante com água sanitária","gás tóxico","misturar soda com ácido","misturar água sanitária com álcool","cloro com ácido","misturei e deu fumaça"],k:["misturar","gás tóxico","água sanitária"],a:"⚠️ **Nunca misture por conta própria:**\n\n• **Água sanitária/cloro + ácidos** (vinagre, ácido muriático, limpa-pedras, removedores) → libera **gás cloro**, muito tóxico.\n• **Água sanitária + amônia** (ou limpa-vidros com amônia) → gases tóxicos.\n• **Água sanitária + álcool** → gera substâncias irritantes e perigosas.\n• **Ácido forte + soda** → reação violenta com calor.\n\nUse **somente as combinações das fórmulas do curso**, na ordem indicada. Se sentir cheiro forte, saia do local, ventile e procure ar fresco.",chips:["E se eu me queimar?","Ordem de adição dos ingredientes"]},{id:"acidente",t:"E se eu me queimar?",q:["e se eu me queimar","queimou a pele","respingou no olho","irritou a pele","engoli produto","inalei gás","acidente com produto químico","intoxicação","primeiros socorros","criança tomou produto","cheiro forte passei mal","tontura com cheiro","queimadura química","respirei vapor"],k:["queimadura","intoxicação","acidente","socorro"],a:"🚨 **Em caso de acidente, aja já:**\n\n• **Pele/olhos:** lave com **água corrente em abundância por pelo menos 15 minutos** e retire roupas contaminadas.\n• **Inalação:** vá para um local arejado.\n• **Ingestão:** **não provoque vômito**; leve a embalagem/rótulo.\n\nLigue para o **Disque-Intoxicação: 0800 722 6001** (24h, gratuito) ou **SAMU: 192**, ou vá a um pronto-socorro. Em seguida, se quiser, avise o João.",btns:[{l:"Ligar Disque-Intoxicação",url:"tel:08007226001"}]},{id:"ordem_adicao",t:"Ordem de adição dos ingredientes",q:["ordem de adição dos ingredientes","qual ingrediente coloco primeiro","ácido na água ou água no ácido","como dissolver a soda","ordem de misturar","o que adiciono primeiro","posso misturar tudo junto","em que ordem misturo","dissolver soda cáustica","colocar tensoativo antes da água","a ordem importa"],k:["ordem","dissolver soda"],a:"A **ordem importa**. Regras de ouro (e siga sempre a sequência de cada fórmula):\n\n1. Comece pela **água** no tanque.\n2. **Ácidos e soda:** adicione sempre **o produto na água, devagar** — nunca água sobre ácido/soda concentrados (a reação esquenta e respinga).\n3. **Tensoativo (espumante):** acrescente **aos poucos e devagar** para não formar espuma demais.\n4. **Sal:** por último de espessar, **aos poucos**, testando a viscosidade.\n5. **Essência, corante e conservante** no final, com a mistura já homogênea.\n6. Misture **lentamente** e deixe **descansar** antes de medir o pH e envasar.",chips:["Meu produto ficou ralo","Muita espuma","Como medir o pH?"]},{id:"ph",t:"Como medir o pH?",q:["como medir o ph","qual o ph ideal","fita de ph","preciso de phmetro","o que é ph","ph do produto","ph de limpeza","ph ideal do multiuso","como saber se o ph está certo","medidor de ph","o ph está fora","ph muito alto","ph muito baixo","como corrigir o ph","como baixar o ph","como subir o ph","ajustar ph","neutralizar"],k:["ph","phmetro","fita de ph"],a:"O **pH** diz se o produto é ácido (baixo) ou alcalino (alto). Para produtos de limpeza geral (multiuso, detergente, sabão), o ideal costuma ficar **entre 6 e 8** — cada fórmula informa o valor-alvo.\n\n**Como medir:** use **fita de pH** (barata e prática) ou um **pHmetro** (mais preciso). Meça com a mistura já homogênea e descansada.\n\n**Como corrigir:**\n• pH **alto** → adicione **ácido cítrico** (solução diluída) aos poucos.\n• pH **baixo** → adicione **solução de soda** bem diluída, devagar, mexendo e medindo a cada ajuste.\n\nSempre com luvas e óculos, e em passos pequenos.",chips:["Cuidados de segurança","Ordem de adição dos ingredientes"]},{id:"ralo",neg:!0,t:"Meu produto ficou ralo",q:["meu produto ficou ralo","ficou aguado","não engrossou","como engrossar","como deixar mais grosso","ficou muito líquido","produto fino demais","viscosidade baixa","aumentar a viscosidade","o detergente não engrossa","o shampoo ficou ralo","perdeu a viscosidade","ficou mais ralo depois de colocar sal","sal engrossar"],k:["ralo","engrossar","viscosidade"],a:'Para **engrossar**, o ajuste clássico é o **sal (cloreto de sódio)**, mas com técnica:\n\n• Adicione **aos poucos**, mexendo bem e **testando a cada adição**.\n• ⚠️ Acima de ~**1%** o efeito **inverte** e o produto fica **mais ralo** — esse é o erro mais comum!\n• A viscosidade final só aparece depois de **descansar** (algumas horas).\n• Alguns produtos precisam de outro espessante (ex.: goma xantana, HEC) — veja no glossário.\n• Água em excesso, tensoativo fraco ou pouco tensoativo também deixam ralo.\n\nTem uma fórmula específica em mente? Me diga o nome e eu mostro os "erros comuns" dela.',chips:["O que é goma xantana?","Muita espuma"]},{id:"espuma",t:"Muita espuma / pouca espuma",q:["muita espuma","espuma demais","não faz espuma","pouca espuma","como reduzir espuma","espuma na hora de misturar","espumou muito","como aumentar a espuma","o produto não espuma","espuma no tanque","espuma não baixa","antiespumante"],k:["espuma"],a:"**Espuma demais na produção:** adicione o tensoativo **devagar**, com a pá rente à parede do recipiente e agitação suave, sem bater. Deixe a espuma **descansar/baixar** antes de continuar. Em lotes maiores, misture em **rotação baixa**.\n\n**Pouca espuma:** confira se usou o **tensoativo certo e na quantidade da fórmula** (LESS 27% vs 70% mudam a quantidade!), se a água é muito dura (use o **EDTA**) e se a dosagem de sal está correta.\n\nFórmulas de limpeza pesada ou de chão podem ser de **baixa espuma de propósito**.",chips:["O que é EDTA?","LESS 27% e 70%: qual a diferença?"]},{id:"turvo",neg:!0,t:"Produto separou / turvo",q:["produto separou","ficou turvo","ficou leitoso","apareceram grumos","talhou","o produto ficou em duas fases","depósito no fundo","precipitou","ficou embaçado","borra no fundo","separação de fases","ficou com grumo","flocos no produto","por que turvou"],k:["separou","turvo","grumos","precipitou"],a:"Produto **turvo, separado ou com grumos** quase sempre vem de um destes motivos:\n\n• **Ordem errada** de adição ou mistura rápida demais.\n• **Sal em excesso** ou adicionado de uma vez.\n• **Água dura** (use o sequestrante **EDTA**) — prefira água filtrada/deionizada.\n• **Essência/perfume sem solubilizante** — fragrâncias oleosas precisam de um tensoativo não iônico/solubilizante.\n• Ingredientes **frios ou mal dissolvidos** (dissolva pós em água morna à parte).\n• pH fora da faixa.\n\nRefaça em lote pequeno corrigindo um fator por vez. Se quiser, me diga a fórmula e o que viu.",chips:["Essência não mistura","Como medir o pH?"]},{id:"essencia",t:"Essência não mistura",q:["essência não mistura","fragrância separa","essência boia","como misturar essência","perfume não dissolve","óleo essencial não mistura","essência fica em cima","essência cortou o produto","quanto de essência usar","solubilizar essência","a essência desandou o produto"],k:["essência","fragrância","solubilizar"],a:"Essências são oleosas e podem boiar ou turvar o produto. Para misturar bem:\n\n• **Misture a essência com um pouco do tensoativo/solubilizante** (ex.: não iônico) **antes** de colocar no tanque.\n• Adicione no **final**, com o produto já pronto e homogêneo, sob agitação suave.\n• Respeite a **dosagem da fórmula** — excesso de essência faz turvar e pode alterar a viscosidade.\n• Prefira essências **próprias para base aquosa/limpeza**.\n\nCada fórmula informa as fragrâncias indicadas e a quantidade.",chips:["Produto separou/turvo","Fórmulas com fragrância"]},{id:"cheiro",neg:!0,t:"Cheiro ruim / produto estragou",q:["cheiro ruim","produto está com mau cheiro","azedou","mofo no produto","apareceu mofo","produto estragou","cheiro de podre","fedendo","bolhas no frasco","inchou o frasco","produto com fungo","bactéria no produto","cheiro de azedo","por que estraga","cheiro estranho","o cheiro mudou","cheiro diferente"],k:["mau cheiro","mofo","azedou","estragou"],a:"Cheiro ruim, mofo ou frasco estufando indicam **contaminação**. As causas mais comuns:\n\n• **Faltou conservante** (ou dose errada) — ele evita mofo e bactérias.\n• Água, balde, tanque ou frasco **mal higienizados**.\n• Produto armazenado **aberto**, no calor ou ao sol.\n\n**Para evitar:** higienize tudo antes (lave e enxágue bem), use **conservante na dose da fórmula**, envase em embalagem limpa e bem fechada. Produto contaminado **não deve ser vendido** — descarte e refaça com a higiene reforçada.",chips:["O que é conservante?","Validade do produto"]},{id:"conservante",t:"O que é conservante?",q:["o que é conservante","preciso de conservante","qual conservante usar","posso não usar conservante","quanto de conservante","para que serve o conservante","conservante é obrigatório","conservante de produto de limpeza","sem conservante estraga"],k:["conservante"],a:'O **conservante** protege o produto de **mofo, fungos e bactérias**, principalmente em produtos com muita água (sabão líquido, detergente, amaciante, shampoo). Sem ele, o produto pode azedar ou criar limo em poucos dias.\n\nUse sempre na **dose indicada na fórmula**, adicionando no final. Produtos muito ácidos, alcalinos ou com alto teor de álcool/cloro são menos propensos, mas siga a fórmula. Veja mais no **glossário** (pergunte "o que é Kathon" ou "benzoato de sódio").',chips:["Cheiro ruim / produto estragou","Validade do produto"]},{id:"validade",t:"Validade do produto",q:["validade do produto","quanto tempo dura","prazo de validade","quanto tempo o produto dura","vence","tempo de prateleira","posso estocar quanto tempo","data de validade no rótulo","qual validade colocar","durabilidade"],k:["validade","prateleira","durabilidade"],a:"A validade depende da **fórmula, do conservante, da higiene e do armazenamento** — não existe um número único. Para vender, o ideal é fazer **testes de estabilidade** do seu lote e definir a validade com base neles (o Guia de Legalização explica o que colocar no rótulo).\n\nPara durar mais: **conservante na dose certa, embalagem limpa e bem fechada**, local **fresco e ao abrigo do sol**.",chips:["Como armazenar?","Rótulo"]},{id:"armazenar",t:"Como armazenar?",q:["como armazenar","onde guardar o produto","como guardar","armazenamento","posso deixar no sol","guardar matéria-prima","estoque dos insumos","como estocar","local de armazenamento","guardar no calor"],k:["armazenar","guardar","estocar"],a:"Boas práticas de armazenamento:\n\n• Local **fresco, seco, ventilado e ao abrigo do sol**.\n• Embalagens **bem fechadas e rotuladas** (nome + data de fabricação + cuidados).\n• **Nunca** guarde em garrafas de bebida/alimento.\n• Separe **ácidos, soda e cloro** uns dos outros.\n• Longe de **crianças, animais e alimentos**.\n• Insumos: mantenha nas embalagens originais, bem tampadas.",chips:["Cuidados de segurança","Validade do produto"]},{id:"embalagem",t:"Que embalagem usar?",q:["que embalagem usar","qual frasco","onde comprar embalagem","frascos para envasar","galão","tipo de embalagem","garrafa pet serve","embalagem para shampoo","embalagem para perfume","embalagem para vender","envase","como envasar","tampa dosadora","pulverizador"],k:["embalagem","envasar","frasco"],a:'A embalagem depende do produto — **cada fórmula traz a sugestão** (veja "Fragrância, Cor e Embalagem" dentro dela). De forma geral:\n\n• Use embalagens **novas ou muito bem higienizadas**, de **plástico (PET/PEAD) compatível** com o produto.\n• **Nunca** reaproveite embalagens de alimento/bebida.\n• Para ácidos e cloro, use embalagens **adequadas e resistentes**.\n• O **rótulo** precisa estar correto para vender (veja o Guia de Legalização).\n\nFornecedores de embalagens estão na lista do app.',chips:["Fornecedores","Rótulo"]},{id:"equipamentos",t:"Que equipamentos preciso?",q:["que equipamentos preciso","o que preciso para começar a fabricar","preciso de balança","que utensílios","material para produzir","qual recipiente usar","tanque de inox","misturador","agitador","posso misturar à mão","pode usar balde","lista de materiais","o que comprar para fazer","investimento inicial"],k:["equipamentos","utensílios","balança","balde","misturador"],a:"Para começar em **lotes pequenos**, o básico é:\n\n• **Balança** (de preferência de precisão, 1 g ou menos) e **medidores/seringas**\n• **Recipiente** de plástico (PEAD) ou inox, limpo, com marcação de litros\n• **Pá/colher** de plástico ou inox para misturar **devagar**\n• **Fita de pH**\n• **EPIs:** luvas, óculos e máscara\n• Funil, peneira e **embalagens** limpas\n\nEvite recipientes de **alumínio ou ferro** com ácidos/alcalinos fortes. Para volumes maiores, o ideal é um tanque com **agitador**. Valores de investimento variam muito — use a **Calculadora de Lucro** para simular.",chips:["Como fazer lote pequeno?","Ferramentas bônus"]},{id:"lote",t:"Como fazer lote pequeno?",q:["como fazer lote pequeno","reduzir a fórmula","quero fazer só 5 litros","fórmula para menos litros","regra de três","diminuir a quantidade","adaptar para menos litros","converter litros","a fórmula é para quantos litros","quantidade para 1 litro","como adaptar a receita","calcular quantidade","fazer menos"],k:["lote pequeno","regra de três","reduzir"],a:'As fórmulas profissionais são calculadas para **100 litros**. Para fazer menos, é uma regra de três: **quantidade ÷ 100 × litros que você quer**. (Ex.: para 10 L, divida tudo por 10; para 5 L, por 20.)\n\n👉 Eu calculo pra você! Diga o produto e o volume, por exemplo: **"quero fazer 10 litros de multiuso"**.\n\nEm lotes pequenos, use balança de precisão e **faça um teste antes** de produzir mais.',chips:["Quero fazer 10 litros de multiuso","Quero fazer 5 litros de sabão líquido"]},{id:"agua",t:"Que água usar?",q:["que água usar","água da torneira serve","água destilada","água de poço","precisa de água deionizada","qual água para fabricar","água filtrada","água dura","posso usar água da torneira"],k:["água dura","deionizada","destilada"],a:'Dá para usar **água comum (torneira/poço)** em muitos produtos, mas a **qualidade da água muda o resultado**. Água muito **dura** (com muito cálcio/magnésio) atrapalha espuma e pode turvar — o **EDTA** ajuda a controlar. Para produtos sensíveis (perfumes, cosméticos, pretinho), prefira água **filtrada, deionizada ou destilada**.\n\nVeja no glossário os itens "Água comum" e "Água deionizada/destilada".',chips:["O que é EDTA?"]},{id:"cor",t:"Que corante usar?",q:["que corante usar","quanto de corante","corante mancha","cor do produto","corante para detergente","qual cor usar","o corante não dissolve","corante sujou a roupa","cor mudou","a cor desbota"],k:["corante"],a:'Use **corantes próprios para produtos de limpeza**, em **pouquíssima quantidade** (q.s. = "quanto baste") e **diluídos antes** em um pouco de água para não manchar nem formar pontos escuros. Corante em excesso pode **manchar roupas e superfícies**.\n\nCada fórmula sugere a cor (veja "Fragrância, Cor e Embalagem"). Se a cor desbotou, pode ser **sol**, pH ou incompatibilidade — guarde ao abrigo da luz.',chips:["Que embalagem usar?"]},{id:"substituir",t:"Posso trocar um ingrediente?",q:["posso trocar um ingrediente","não achei o insumo","posso usar outro tensoativo","tem substituto","o que usar no lugar","trocar marca","substituir o insumo","não encontrei na minha cidade","posso trocar por outro","alternativa para o ingrediente"],k:["substituto","substituir","trocar ingrediente"],a:'Em muitos casos sim. O **glossário** mostra, para cada insumo, a coluna **"Substituto"**. Mas atenção: trocar ingrediente pode mudar **viscosidade, espuma, pH e cheiro**; e a concentração importa (ex.: LESS 27% ≠ LESS 70%).\n\nSempre faça **lote teste pequeno** primeiro. Me pergunte por um insumo específico: **"substituto do LESS"**, por exemplo.',chips:["Substituto do LESS","Glossário de insumos"]},{id:"rende",t:"Quanto rende o produto?",q:["quanto rende","rendimento","posso diluir mais","diluir para render","como diluir","rende quantos litros","dá para colocar mais água","quanto de água adicionar","diluição do produto"],k:["rendimento","diluir"],a:'Cada fórmula tem uma tabela de **Diluição** (uso direto, rendimento 1:1 etc.). Diluir demais enfraquece a limpeza e pode comprometer a conservação.\n\nDiga a fórmula e eu mostro a diluição dela: por exemplo, **"diluição do multiuso tradicional"**.',chips:["Diluição do multiuso tradicional"]},{id:"comecar",t:"Por onde começo?",q:["por onde começo","primeiros passos","sou iniciante o que faço primeiro","nunca fiz o que fazer","como começar do zero","qual fórmula começar","plano para começar","qual a melhor fórmula para iniciar","qual produto vende mais","o que fabricar primeiro","como iniciar o negócio","passo a passo para começar"],k:["começar","iniciar","primeiros passos"],a:'Um caminho simples para começar:\n\n1. **Escolha 1 ou 2 fórmulas de entrada** (as de uso diário, como multiuso, sabão líquido ou shampoo — são as mais vendidas).\n2. Veja os insumos no **glossário** e onde comprar na lista de **fornecedores**.\n3. Faça um **lote teste pequeno** (use "quero fazer 5 litros") e valide cheiro, espuma, viscosidade e pH.\n4. **Venda antes de fabricar em escala:** valide com amostras e pré-encomendas.\n5. Calcule **custo e preço** nas ferramentas bônus.\n6. **Regularize** o negócio com o Guia de Legalização antes de vender em escala.\n\nO capítulo **"Plano de 30 dias"** do Guia de Legalização organiza esse roteiro dia a dia.',chips:["Plano de 30 dias","Como calcular o preço de venda","Quero fazer 5 litros de multiuso"]},{id:"precificar",t:"Como calcular o preço de venda",q:["como calcular o preço de venda","quanto cobrar","como precificar","qual preço vender","calcular custo por litro","quanto de lucro dá","quanto posso ganhar","quanto lucro por litro","margem de lucro","formar preço","que preço cobrar","qual preço cobrar","quanto devo cobrar","preço de venda do litro","quanto vale o litro","como saber meu lucro","dá dinheiro","dá lucro"],k:["precificar","lucro","margem","quanto cobrar"],a:'Para formar preço, some o **custo dos insumos por litro** + **embalagem, rótulo, perdas, frete, impostos e seu tempo**, e aplique a margem que quiser.\n\nCada fórmula mostra o **custo estimado e um argumento de venda** (abra a fórmula ou pergunte "custo do multiuso"). E as ferramentas bônus fazem as contas por você:\n\n• 💰 **Precificação Automática** · 📊 **Calculadora de Lucro**\n\n⚠️ Os valores são **referências**: custos variam por região e fornecedor, e eu não prometo ganhos — faça as contas com os seus números.',chips:["Ferramentas bônus","Custo do multiuso"]},{id:"vender_onde",t:"Como e onde vender?",q:["como vender","onde vender","como conseguir clientes","como divulgar","vender no instagram","vender para mercado","vender na internet","quem compra","estratégia de vendas","primeiros clientes","posso vender para lojas","como achar clientes","preciso de loja","marketing"],k:["vender","clientes","divulgar"],a:'O curso mostra o caminho: **valide antes de fabricar** — apresente amostras e colete pré-encomendas (vizinhança, comércios, condomínios, oficinas, lava-jatos, salões, redes sociais) e só depois produza em escala. Os produtos de **uso diário** têm venda recorrente.\n\nNo Guia de Legalização, o capítulo **"Venda Antes de Fabricar"** detalha isso, e cada fórmula traz um **argumento de venda** pronto. Para vender com segurança, regularize antes de escalar.',chips:["Venda antes de fabricar","Posso vender os produtos?","Como calcular o preço de venda"]},{id:"posso_vender",t:"Posso vender os produtos?",q:["posso vender os produtos","posso vender sem cnpj","preciso de cnpj para vender","preciso de anvisa","posso vender em casa","é legal vender","preciso de licença","vender sem registro","posso vender produto de limpeza feito em casa","qual a lei para vender","preciso de autorização","fabricar em casa para vender"],k:["vender sem cnpj","autorização"],a:"Para **fabricar e vender** produtos de limpeza e automotivos há **exigências legais** (notificação/registro na ANVISA conforme o tipo de produto, rótulo correto, responsável técnico, empresa, licença sanitária etc.). Um caminho mais simples para começar é **revender produtos prontos de fabricantes regularizados**.\n\nO **Guia de Legalização** explica tudo passo a passo, em linguagem simples. As regras variam por produto e município — confirme sempre com os órgãos competentes.",chips:["Posso começar como MEI?","Notificação ANVISA","Guia de Legalização"]},{id:"mei",t:"Posso começar como MEI?",q:["posso começar como mei","mei pode fabricar","sou mei posso fabricar","mei ou me","qual empresa abrir","tipo de empresa","preciso abrir empresa","microempresa","cnpj mei","mei vende produto de limpeza","qual cnpj usar"],k:["mei","me","cnpj"],a:'Sim, dá para **começar estudando as fórmulas e planejando sua linha**. Para vender como **MEI**, um caminho é **revender produtos prontos de fabricantes regularizados**. Já para **fabricar e vender suas próprias fórmulas**, é necessário atuar como **ME** (ou outro porte compatível) e cumprir as exigências de licenciamento e regularização de cada produto.\n\nO curso ensina a parte técnica; ele **não substitui a formalização**. O Guia de Legalização tem o capítulo **"Abrindo Sua Empresa"**.',chips:["Abrir empresa","Notificação ANVISA"]},{id:"guia_leg",comprar:"leg",t:"Guia de Legalização",q:["guia de legalização","o que tem no guia de legalização","legalização","o guia ensina a legalizar","como legalizar meu negócio","regularizar produto","quais capítulos","capítulos do guia","o que ensina a legalização","quero comprar o guia de legalização","como compro o guia","quanto custa o guia de legalização","comprar o guia"],k:["legalização","guia"],a:function(a,o){var e=o.dados().LG||[];return"⚖️ O **Guia de Legalização** tem 9 capítulos:\n\n"+(e.length?e.map(function(a){return a.num+". "+a.title}).join("\n"):"1. Os 3 Caminhos para Começar\n2. Venda Antes de Fabricar\n3. O Que Você Pode Vender\n4. Notificação ANVISA P "qual e-mail uso no clube","preciso de senha no clube","login do clube"],k:["entrar clube"],a:"Para entrar no Clube, digite o **mesmo e-mail da sua compra** (de qualquer um dos cursos). Não precisa de senha. 🔓\n\nSe aparecer que o e-mail não foi encontrado: confira a digitação, tente o outro e-mail que você possa ter usado, e se ainda assim não entrar, **chame o suporte** (**"+o+"**). Quem ainda não é aluno pode conhecer os cursos na própria tela de entrada.",btns:["wa"],chips:["Esqueci qual e-mail usei","Paguei e não liberou"]},{id:"c_postar",t:"Como postar no clube?",only:e,q:["como postar no clube","como criar uma publicação","como faço uma pergunta","como publicar","como tirar dúvida no clube","onde escrevo minha dúvida","botão de nova publicação","como postar uma foto","nova publicação","criar post","como compartilhar meu resultado"],k:["postar","publicar","nova publicação"],a:"Toque no botão **+ / Nova publicação**, escolha a **categoria**, escreva o título (opcional) e o texto, e se quiser **anexe até 3 fotos**. Depois é só publicar! ✍️\n\nCategorias:\n• **Dúvidas** — perguntas sobre fórmulas e produção\n• **Resultados** — mostre o que você fez\n• **Dicas e receitas** — compartilhe o que aprendeu\n• **Avisos da equipe** — novidades (só a equipe publica)\n\nDica: numa dúvida, conte **qual fórmula, o que fez, o que esperava e o que aconteceu**. Assim a resposta vem mais rápida!",chips:["Por que minha publicação foi bloqueada?","Regras do clube"]},{id:"c_comentar",t:"Como comentar e curtir?",only:e,q:["como comentar","como responder uma dúvida","como curtir","como responder um post","posso comentar com foto","curtir publicação","responder alguém","enviar foto no comentário"],k:["comentar","curtir","responder"],a:"Abra a publicação, escreva no campo de comentário (dá para **anexar uma foto**) e envie. Para curtir, toque no **coração** ♡ da publicação. 💬",chips:["Melhor resposta e dúvida resolvida","Regras do clube"]},{id:"c_resolvido",t:"Melhor resposta e dúvida
