<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="description" content="200+ fórmulas de limpeza profissionais — o guia completo para produzir e vender.">

<style>
:root{--bg:#080B0F;--bg2:#0E1117;--card:#111418;--ch:#181D24;--brd:#1E2530;--acc:#E8720C;--acl:#FFB347;--acd:#C4580A;--glo:rgba(232,114,12,0.15);--txt:#F2F4F6;--mut:#8B95A1;--dim:#4A5568;--grn:#22C55E;--blu:#3B82F6;--r:12px;--rl:18px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;direction:ltr;}
/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
.sp-logo{font-size:34px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#E8720C,#FFB347);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:fu .8s ease forwards;}
.sp-sub{font-size:12px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;animation:fu .8s .2s ease both;text-align:center;padding:0 32px;line-height:1.6;}
.sp-bar{width:120px;height:3px;background:var(--brd);border-radius:2px;overflow:hidden;animation:fu .8s .4s ease both;}
.sp-p{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acl));animation:lb 1.8s .5s ease forwards;}
@keyframes lb{to{width:100%;}}@keyframes fu{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes fi{from{opacity:0;}to{opacity:1;}}@keyframes su{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
/* APP */
#app{display:flex;flex-direction:column;min-height:100vh;}
/* HEADER */
#hdr{position:sticky;top:0;z-index:100;background:rgba(8,11,15,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--brd);padding:12px 16px;display:flex;align-items:center;gap:10px;}
.hdr-logo{font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;flex-shrink:0;}
.hdr-search{flex:1;position:relative;}
.hdr-search input{width:100%;background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:8px 12px 8px 32px;color:var(--txt);font-size:14px;outline:none;transition:border-color .2s;cursor:pointer;direction:ltr;text-align:left;}
.hdr-search input:focus{border-color:var(--acc);}
.hdr-search input::placeholder{color:var(--dim);}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none;}
.hdr-acts{display:flex;gap:6px;flex-shrink:0;}
.ib{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--brd);color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .2s;}
.ib:hover{background:var(--ch);color:var(--acc);border-color:var(--acc);}
/* MAIN */
#main{flex:1;padding-bottom:80px;}
/* BOTTOM NAV */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(8,11,15,.96);backdrop-filter:blur(16px);border-top:1px solid var(--brd);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 4px;color:var(--dim);font-size:10px;transition:color .2s;border:none;background:none;text-decoration:none;letter-spacing:.3px;}
.ni .ico{font-size:18px;line-height:1;}
.ni.on{color:var(--acc);}
/* PROGRESS */
.pb{height:2px;background:var(--brd);}
.pf{height:100%;background:linear-gradient(90deg,var(--acc),var(--acl));transition:width .3s;}
/* HOME */
.wb{margin:16px;padding:18px;background:linear-gradient(135deg,var(--card),rgba(232,114,12,.06));border:1px solid var(--brd);border-left:3px solid var(--acc);border-radius:var(--rl);}
.wg{font-size:10px;color:var(--acc);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.wt{font-size:18px;font-weight:800;margin-bottom:6px;}
.wx{font-size:13px;color:var(--mut);line-height:1.6;}
.sl{padding:0 16px;margin:18px 0 10px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px;}
.sl::after{content:'';flex:1;height:1px;background:var(--brd);}
/* PRODUCT CARDS (home) */
.pg{display:flex;flex-direction:column;gap:10px;padding:0 16px;}
.pc{background:var(--card);border:1px solid var(--brd);border-radius:var(--rl);padding:16px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;}
.pc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--glo),transparent 60%);opacity:0;transition:opacity .25s;}
.pc:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:0 0 24px var(--glo);}
.pc:hover::before{opacity:1;}
.pc.lk{opacity:.85;}
.pc.lk:hover{transform:none;border-color:var(--brd);}
.pc-icon{font-size:32px;flex-shrink:0;}
.pc-body{flex:1;min-width:0;}
.pc-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.pc-sub{font-size:12px;color:var(--mut);line-height:1.4;}
.pc-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0;}
.pc-badge.inc{background:var(--acc);color:#fff;}
.pc-badge.lk2{background:var(--glo);color:var(--acl);border:1px solid var(--acc);animation:pulse 2.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,114,12,.35);}50%{box-shadow:0 0 0 4px rgba(232,114,12,0);}}
.pc-hint{color:var(--acl);font-size:10.5px;font-weight:700;margin-top:6px;}
.pc-badge.unl{background:rgba(34,197,94,.2);color:var(--grn);border:1px solid rgba(34,197,94,.3);}
/* UTILITY CARDS */
.ug{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.uc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;display:block;}
.uc:hover{border-color:var(--acc);transform:translateY(-1px);}
.uc-icon{font-size:24px;margin-bottom:8px;}
.uc-name{font-size:13px;font-weight:700;margin-bottom:3px;}
.uc-sub{font-size:11px;color:var(--mut);}
/* BONUS */
.bg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.bc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:12px;text-decoration:none;color:inherit;display:block;transition:all .2s;}
.bc:hover{border-color:var(--acl);transform:translateY(-1px);}
.bic{font-size:20px;margin-bottom:6px;}
.bn{font-size:12px;font-weight:700;margin-bottom:3px;line-height:1.3;}
.bd{font-size:11px;color:var(--mut);line-height:1.4;}
.bl{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.5px;text-transform:uppercase;}
/* SUB-APP HEADER */
.sah{padding:14px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;background:rgba(8,11,15,.95);backdrop-filter:blur(12px);}
.bb{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--brd);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;flex-shrink:0;transition:all .2s;}
.bb:hover{border-color:var(--acc);}
.sat{flex:1;}
.sat-icon{font-size:18px;}
.sat-name{font-size:16px;font-weight:700;}
.sat-sub{font-size:11px;color:var(--mut);margin-top:1px;}
/* DOWNLOAD BUTTON */
.dl-wrap{padding:12px 16px;}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--brd);color:var(--txt);padding:12px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;width:100%;}
.dl-btn:hover{border-color:var(--acc);color:var(--acc);}
/* CATEGORY CARDS (inside sub-app) */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.cc{background:var(--card);border:1px solid var(--brd);border-radius:var(--rl);padding:16px 13px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;text-decoration:none;color:inherit;display:block;}
.cc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--glo),transparent 60%);opacity:0;transition:opacity .25s;}
.cc:hover{border-color:var(--acc);transform:translateY(-2px);}
.cc:hover::before{opacity:1;}
.ci{font-size:24px;margin-bottom:8px;display:block;}
.cn{font-size:13px;font-weight:700;margin-bottom:3px;line-height:1.3;}
.ck{font-size:11px;color:var(--mut);}
/* FORMULA LIST */
.fl{padding:8px 16px;}
.fi{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin-bottom:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;}
.fi:hover{border-color:var(--acc);background:var(--ch);}
.fi.sv{border-left:3px solid var(--acc);}
.fi.vd{border-left:3px solid var(--grn);}
.fi.lk{opacity:.68;}
.fi.fr{border-left:3px solid var(--grn);}
/* PREVIEW MODE */
.prevbar{margin:12px 16px 0;padding:12px 14px;background:linear-gradient(135deg,var(--acc),var(--acd));border-radius:var(--r);display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(232,114,12,.3);}
.prevbar-tx{flex:1;font-size:12px;font-weight:700;line-height:1.4;color:#fff;}
.prevbar-cta{background:#fff;color:var(--acd);padding:8px 14px;border-radius:20px;font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap;flex-shrink:0;}
.fic{flex:1;min-width:0;}
.fit{font-size:14px;font-weight:600;margin-bottom:4px;}
.fid{font-size:12px;color:var(--mut);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.far{color:var(--dim);font-size:20px;flex-shrink:0;}
/* FORMULA DETAIL */
.fh{padding:18px 16px;border-bottom:1px solid var(--brd);background:linear-gradient(135deg,var(--card),rgba(232,114,12,.04));}
.ftm{font-size:20px;font-weight:800;line-height:1.2;margin-bottom:6px;}
.fdm{font-size:13px;color:var(--mut);line-height:1.6;}
.fav-btn{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--brd);color:var(--mut);font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;transition:all .2s;margin-top:12px;}
.fav-btn.on{color:var(--acc);border-color:var(--acc);background:var(--glo);}
/* DETAIL SECTIONS */
.sb{padding:16px;border-bottom:1px solid var(--brd);}
.sb:last-child{border-bottom:none;}
.bt{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.bt::after{content:'';flex:1;height:1px;background:rgba(232,114,12,.2);}
.ul2{display:flex;flex-wrap:wrap;gap:6px;}
.ut2{background:var(--card);border:1px solid var(--brd);color:var(--mut);font-size:11px;padding:4px 9px;border-radius:6px;}
table.ft,table.dt{width:100%;border-collapse:collapse;}
table.ft th,table.dt th{background:var(--bg2);color:var(--mut);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:1px solid var(--brd);}
table.ft td,table.dt td{padding:8px 10px;font-size:12px;border-bottom:1px solid var(--brd);vertical-align:top;}
table.ft tr:last-child td,table.dt tr:last-child td{border-bottom:none;}
table.ft tr:hover td,table.dt tr:hover td{background:var(--ch);}
table.ft td:last-child{color:var(--acl);font-weight:700;font-family:'Courier New',monospace;text-align:right;white-space:nowrap;}
.dr{font-family:'Courier New',monospace;font-weight:700;color:var(--acc);font-size:13px;}
.de{color:var(--mut);font-size:11px;}
.ifl{display:flex;flex-direction:column;gap:9px;}
.ifi{display:flex;gap:10px;}
.ifn{font-size:11px;font-weight:700;color:var(--acl);flex-shrink:0;min-width:120px;}
.ifd{font-size:12px;color:var(--mut);line-height:1.5;}
.pl{display:flex;flex-direction:column;gap:10px;}
.ps{display:flex;gap:10px;align-items:flex-start;}
.pn{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ptx{font-size:13px;line-height:1.6;padding-top:2px;}
.wl{display:flex;flex-direction:column;gap:7px;}
.wi{display:flex;gap:9px;align-items:flex-start;background:var(--card);border-radius:8px;padding:9px 10px;border:1px solid var(--brd);}
.wic{font-size:13px;flex-shrink:0;}
.wtx{font-size:12px;color:var(--mut);line-height:1.5;}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ip{background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:10px;}
.ipl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.ipv{font-size:12px;line-height:1.4;}
.sales{background:linear-gradient(135deg,var(--glo),transparent);border:1px solid rgba(232,114,12,.3);border-radius:var(--r);padding:13px;}
.sq{font-size:13px;font-weight:600;line-height:1.5;font-style:italic;margin-bottom:6px;}
.cn2{font-size:11px;color:var(--mut);line-height:1.5;}
/* LEGALIZAÇÃO */
.lg-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:15px;margin-bottom:8px;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:12px;}
.lg-card:hover{border-color:var(--blu);background:var(--ch);}
.lg-num{width:28px;height:28px;border-radius:50%;background:var(--blu);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lg-body{flex:1;}
.lg-title{font-size:14px;font-weight:700;margin-bottom:3px;}
.lg-sub{font-size:12px;color:var(--mut);line-height:1.4;}
/* EXCLUSIVA */
.ex-box{margin:16px;padding:20px;background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(139,92,246,.04));border:1px solid rgba(139,92,246,.3);border-radius:var(--rl);}
.ex-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start;}
.ex-num{width:28px;height:28px;border-radius:50%;background:rgba(139,92,246,.8);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ex-txt{font-size:13px;line-height:1.6;padding-top:4px;}
.ex-msg{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin:0 16px 14px;font-size:13px;line-height:1.7;color:var(--mut);}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;padding:14px;border-radius:var(--r);font-size:15px;font-weight:700;text-decoration:none;margin:0 16px;transition:opacity .2s;}
.wa-btn:hover{opacity:.9;}
/* SEARCH */
#search-wrap{padding:14px 16px;border-bottom:1px solid var(--brd);}
#search-inp{width:100%;background:var(--card);border:1px solid var(--acc);border-radius:8px;padding:12px 14px 12px 36px;color:var(--txt);font-size:15px;outline:none;direction:ltr;text-align:left;unicode-bidi:embed;}
#search-icon{position:absolute;left:26px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;}
#search-results{min-height:200px;animation:fi .2s ease;}
/* GLOSSARY */
.gs{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--brd);}
.gs input{width:100%;background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:10px 13px;color:var(--txt);font-size:14px;outline:none;direction:ltr;}
.gs input:focus{border-color:var(--acc);}
.gw{overflow-x:auto;}
table.gt{width:100%;border-collapse:collapse;min-width:560px;}
table.gt th{background:var(--bg2);color:var(--mut);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:1px solid var(--brd);}
table.gt td{padding:8px 10px;font-size:11px;border-bottom:1px solid var(--brd);vertical-align:top;}
table.gt tr:hover td{background:var(--ch);}
.gn{font-weight:700;color:var(--txt);font-size:12px;}
.gm{color:var(--mut);}
.gp{color:var(--acl);font-weight:600;white-space:nowrap;}
/* SUPPLIERS */
.sr{padding:10px 16px 4px;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);}
.sc{margin:0 16px 7px;background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:12px;}
.sn{font-size:13px;font-weight:700;margin-bottom:2px;}
.sct{font-size:11px;color:var(--mut);margin-bottom:3px;}
.sco{font-size:11px;color:var(--mut);}
/* EMPTY */
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;text-align:center;}
.ei{font-size:44px;margin-bottom:12px;opacity:.5;}
.et{font-size:17px;font-weight:700;margin-bottom:6px;}
.ex2{font-size:13px;color:var(--mut);line-height:1.5;}
/* WA FLOAT BTN */
.wa-float{position:fixed;bottom:88px;right:14px;z-index:200;width:48px;height:48px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;box-shadow:0 4px 16px rgba(37,211,102,.4);transition:transform .2s;}
.wa-float:hover{transform:scale(1.08);}
/* INSTALL */
#ip{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;}
#ip.open{display:flex;}
.ip-box{background:var(--card);border:2px solid var(--acc);border-radius:var(--rl);padding:22px 18px;width:100%;max-width:440px;animation:su .3s ease;box-shadow:0 0 50px var(--glo);}
.ip-title{font-size:16px;font-weight:800;margin-bottom:5px;text-align:center;}
.ip-sub{font-size:12px;color:var(--mut);text-align:center;margin-bottom:18px;}
.ip-tabs{display:flex;gap:8px;margin-bottom:14px;}
.ip-tab{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--brd);background:var(--bg2);color:var(--mut);text-align:center;transition:all .2s;}
.ip-tab.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.ip-steps{display:flex;flex-direction:column;gap:9px;margin-bottom:16px;}
.ip-step{display:flex;gap:10px;align-items:flex-start;}
.ip-n{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ip-t{font-size:12px;line-height:1.5;padding-top:3px;}
.ip-close{width:100%;padding:11px;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer;}
/* PRINT */
@media print{body{background:#fff;color:#000;}#hdr,#nav,.wa-float,#ip,.fav-btn{display:none!important;}.ftm,.bt{color:#E8720C;}.pn{background:#E8720C;}}
/* RESPONSIVE */
@media(min-width:768px){.cg{grid-template-columns:repeat(3,1fr);}#main{max-width:768px;margin:0 auto;}.wa-float{bottom:22px;right:22px;}#nav{display:none;}}
</style>
</head>
<body>

o antes de fechar.", "Rotule com a instrução \"Não borrifar direto na tela — aplicar no pano\", data de fabricação e lote. Validade sugerida: 12 meses, em local fresco."], "dil": [["Celular, tablet e monitor", "Puro", "1 borrifada em um pano de microfibra 30×30 cm"], ["TV e telas grandes", "Puro", "2 a 3 borrifadas no pano, nunca na tela, passando em faixas verticais"], ["Teclado, mouse e controle", "Puro", "Pano levemente úmido, sem encharcar as frestas"]], "app": "Desligue e desconecte o aparelho e espere esfriar. Borrife o produto no pano de microfibra (nunca direto na tela). Passe em movimentos suaves e em uma única direção, sem apertar. Finalize com a face seca do pano para tirar o excesso e evitar marcas.", "caut": ["Desligar e desconectar o aparelho antes de limpar — a limpeza com aparelho ligado pode gerar curto-circuito.", "Não borrifar direto na tela, em entradas USB/HDMI nem nas saídas de ventilação — o líquido escorre para dentro.", "Produto inflamável (contém álcool): manter longe de chamas, cigarro e fontes de calor.", "Não usar sobre telas com película especial anti-reflexo sem antes testar num canto: alguns fabricantes proíbem álcool.", "Manter fora do alcance de crianças e longe de alimentos."], "err": ["Usar papel toalha, guardanapo ou pano áspero — risca a tela mesmo sem parecer.", "Usar água de torneira — deixa manchas brancas ao secar.", "Colocar álcool a mais \"para limpar melhor\" — ressecar o revestimento da tela e acelerar o desgaste.", "Envasar com espuma — o spray falha e o volume do frasco fica errado."], "frag": "Neutro (sem perfume)", "cor": "Transparente", "emb": "60 ml, 120 ml, 250 ml", "venda": "Telas limpas, sem digitais e sem marcas — spray seguro para a TV, o celular e o notebook da família.", "custo": "Produto de nicho em frasco pequeno: alto valor percebido por ml e fácil de oferecer junto com um pano de microfibra.", "nivel": "Intermediário", "rend": "100 L", "custoNum": "R$ 1,00/L", "vendaNum": "R$ 10,00/L", "margem": "897%"}, ervante.", "Deixe descansar 2 horas, tampado, para a espuma baixar.", "Meça o pH: deve ficar entre 6,5 e 8. Se estiver abaixo, corrija com gotas de solução de barrilha 10%; se acima, com ácido cítrico 10%. Nunca deixe alcalino — pH alto escurece e opaca o alumínio.", "Envase em frascos spray de 500 ml ou 1 L, rotule com lote e validade (12 meses)."], "dil": [["Uso direto (limpeza leve)", "Puro", "Borrifar e passar o pano"], ["Sujeira média", "1:1", "500 ml do produto + 500 ml de água"], ["Limpeza geral de esquadrias (balde)", "1:20", "100 ml em 2 L de água"]], "app": "Retire a poeira solta com pano seco ou aspirador. Borrife o produto, deixe agir de 1 a 2 minutos e esfregue com esponja macia (lado amarelo) seguindo o sentido do perfil. Retire com pano úmido e seque com pano de microfibra para não ficar marca de água.", "caut": ["Nunca usar produtos alcalinos fortes ou ácidos em alumínio — escurecem e \"queimam\" o acabamento.", "Não usar bucha de aço ou lado verde da esponja — risca o alumínio anodizado.", "Não aplicar sob sol forte: o produto seca rápido e deixa manchas.", "Usar luvas em limpezas longas — o butilglicol resseca a pele.", "Manter fora do alcance de crianças."], "err": ["Colocar o tensoativo de uma vez — espuma excessiva e produto com volume errado.", "Esquecer o EDTA em regiões de água dura — aparecem manchas brancas depois de seco.", "Misturar com outros limpadores (alvejante, ácidos) na hora de usar — risco de gases e danos no metal.", "Não conferir o pH antes de envasar — um lote alcalino pode manchar o alumínio do cliente."], "frag": "Limão ou erva-doce", "cor": "Azul claro ou incolor", "emb": "500 ml, 1 L, 5 L", "venda": "Esquadrias de alumínio limpas e brilhando sem arranhar nem manchar — o limpador certo para as janelas de casa e do comércio.", "custo": "Produto de nicho muito procurado por condomínios, construtoras e empresas de limpeza — vende bem em galão de 5 L.", "nivel": "Intermediário", "rend": "100 L", "custoNum": "R$ 0,54/L", "vendaNu m lote e validade (12 meses)."], "dil": [["Uso direto (manutenção)", "Puro", "Borrifar no pano ou direto na persiana"], ["Sujeira pesada", "Puro, 2 passadas", "Deixar agir 1 minuto antes de passar o pano"]], "app": "Passe antes um espanador ou aspirador com bocal macio. Borrife o produto em um pano de microfibra e deslize pela lâmina da persiana, uma por uma, de cima para baixo. Em cortina de tecido, borrife a 20 cm e deixe secar ao ar, sem torcer.", "caut": ["Fazer teste em um canto escondido de cortinas coloridas ou de tecido delicado.", "Não usar em cortinas de seda, linho cru ou veludo.", "Produto inflamável (contém álcool): longe de chamas.", "Não molhar demais: o excesso escorre e mancha a parede e o piso.", "Manter fora do alcance de crianças e animais."], "err": ["Usar tensoativo aniônico junto com quaternário — forma precipitado e produto turvo.", "Colocar muito antiestático achando que \"protege mais\" — deixa as lâminas pegajosas e atrai sujeira.", "Esquecer de pré-misturar a essência no álcool — o produto sai leitoso.", "Borrifar direto em tecidos claros sem teste — risco de mancha."], "frag": "Algodão, lavanda ou brisa", "cor": "Transparente", "emb": "500 ml, 1 L refil", "venda": "Persianas limpas por mais tempo, sem poeira voltando em dois dias — limpa e protege na mesma passada.", "custo": "Produto de nicho que o cliente raramente encontra pronto: ótimo para vender em kit com pano de microfibra.", "nivel": "Intermediário", "rend": "100 L", "custoNum": "R$ 0,47/L", "vendaNum": "R$ 4,80/L", "margem": "921%"}, {"id": "fl154", "cat": "multiuso-superficies", "catName": "Multiuso & Superfícies", "catIcon": "🧴", "title": "Limpa Linha Branca (Geladeira, Fogão e Micro-ondas por Fora)", "desc": "Limpador de gordura e digitais para eletrodomésticos de linha branca. Limpa a parte externa de geladeira, fogão, micro-ondas, máquina de lavar e freezer, deixando a superfície uniforme e sem manchas.", "uses": ["Geladeira e freezer (parte externa)", "Fogão e cooktop (ex o e seguro para limpar o interior do micro-ondas e de fornos elétricos. Solta respingos e gordura e neutraliza o cheiro de comida, sem deixar resíduo forte.", "uses": ["Interior de micro-ondas", "Fornos elétricos (paredes e porta)", "Air fryers (cesto e interior)", "Bandejas e grelhas leves"], "formula": [["Água", "92,05 L"], ["Butilglicol", "3 L"], ["Ácido cítrico", "500 g"], ["Tensoativo não iônico", "4 L"], ["Essência de limão", "300 ml"], ["Conservante", "150 ml"]], "ingFunc": [["Tensoativo aniônico (LESS 27%)", "Solta a gordura e a sujeira de comida."], ["Butilglicol", "Solvente que amolece gordura queimada."], ["Ácido cítrico", "Acidez leve que solta resíduos e neutraliza odores."], ["Tensoativo não iônico", "Reduz resíduo e favorece o enxágue."], ["Essência de limão", "Perfume fresco que cobre o odor de comida."], ["Conservante", "Estabilidade do produto."]], "prep": ["Coloque 73,6 L de água morna (35 °C).", "Dissolva o ácido cítrico em 1 L de água morna e junte ao tanque.", "Adicione o LESS em 2 etapas, com agitação baixa.", "Em recipiente à parte, misture o butilglicol com o tensoativo não iônico e a essência de limão até homogeneizar. Junte ao tanque em fio.", "Complete com o restante da água (18,4 L) e o conservante.", "Misture 10 minutos e deixe descansar 2 horas.", "Meça o pH: deve ficar entre 4 e 5. Se estiver abaixo de 3,5, aumente a água ou reduza o ácido (o LESS se desfaz em pH muito baixo).", "Envase em frascos spray de 500 ml. Rotule com lote, validade (9 meses) e instruções para uso em aparelho frio."], "dil": [["Uso direto", "Puro", "Borrifar nas paredes frias do aparelho"], ["Gordura queimada", "Puro", "Aplicar, tampar e deixar agir 10 minutos"], ["Manutenção semanal", "1:3", "Aplicar diluído com pano úmido"]], "app": "Com o aparelho desligado e frio, retire os pratos e bandejas. Borrife nas paredes, no teto e na porta, deixe agir 5 minutos e passe um pano úmido. Em gordura queimada, deixe agir 10 minutos e esfregue com esponja macia. Enxágue d ": [["Armário de roupas", "1 sachê", "Um sachê por prateleira ou gaveta"], ["Malas e sapateiras", "1 sachê", "Deixar dentro da mala guardada"], ["Banheiro e armário úmido", "2 sachês", "Trocar a cada 2 meses"]], "app": "Coloque um sachê em cada gaveta, prateleira ou mala. Para ativar o perfume, aperte o sachê entre os dedos a cada 15 dias. Troque o conteúdo a cada 3 meses ou quando o perfume acabar. O bicarbonato usado pode ser reaproveitado na limpeza.", "caut": ["Manter fora do alcance de crianças e animais.", "Não deixar o sachê em contato direto com roupas muito claras: o cravo pode manchar.", "Não colocar sobre madeira sem proteção.", "Substituir quando o pó ficar empedrado e úmido.", "Não ingerir."], "err": ["Colocar muito óleo essencial — mancha o tecido do sachê e as roupas.", "Usar o bicarbonato úmido — empedra e perde efeito.", "Fechar mal o saquinho — o pó escapa.", "Esquecer de trocar — o sachê satura e deixa de funcionar."], "frag": "Lavanda, capim-limão ou cravo e canela", "cor": "Branco com pontos escuros", "emb": "Sachê de 50 g", "venda": "Armário cheiroso e sem mofo — um sachê, uma prateleira.", "custo": "Excelente produto de presente e de revenda em feiras, com embalagem simples e margem alta.", "nivel": "Iniciante", "rend": "10 sachês por lote", "custoNum": "R$ 0,98/sachê", "vendaNum": "R$ 5,00/sachê", "margem": "410%"}, {"id": "fl137", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Limpa Churrasqueira e Grelhas Caseiro (Bicarbonato e Vinagre)", "desc": "Pasta e spray para limpar grelhas e churrasqueiras com a ajuda da espuma que o bicarbonato forma com o vinagre. Solta a gordura e o carvão grudado, sem produtos agressivos.", "uses": ["Grelhas de churrasqueira", "Espetos e grelhas de forno", "Churrasqueiras de alvenaria (pontual)", "Fogões e coifas (gordura leve)"], "formula": [["Bicarbonato de sódio", "400 g"], ["Detergente de louça comum", "100 ml"], ["Vinagre branco", "200 ml"], ["Água", "100 ml"]], "ingFunc": [["Bicarbonato de sódio", "Abrasivo suave e alcalino: solta a gordura e o carvão."], ["Detergente de louça comum", "Emulsiona a gordura solta pelo bicarbonato."], ["Vinagre branco", "Ao reagir com o bicarbonato, forma espuma que levanta a sujeira."], ["Água", "Dá consistência de pasta."]], "prep": ["Use luvas de borracha e avental. Trabalhe ao ar livre ou em local arejado.", "Em uma tigela, misture o bicarbonato (400 g) com o detergente (100 ml) até formar uma farofa úmida.", "Adicione a água (100 ml) aos poucos, mexendo até virar uma pasta firme e espalhável.", "Guarde o vinagre (200 ml) à parte, em um borrifador. Ele só será usado na hora de aplicar a pasta.", "Guarde a pasta em pote com tampa, em local fresco. Validade: 30 dias. Rotule \"Churrasqueira — uso externo\"."], "dil": [["Uso direto (pasta)", "Puro", "Aplicar com espátula ou escova"], ["Gordura grudada", "Puro + vinagre", "Espalhar a pasta e borrifar vinagre; deixar 15 minutos"], ["Manutenção", "Puro", "Camada fina; deixar 5 minutos"]], "app": "Com a grelha fria, espalhe a pasta sobre a gordura e o carvão. Borrife o vinagre por cima: vai formar espuma. Deixe agir de 15 a 20 minutos, esfregue com escova de aço ou esponja e enxágue em água corrente. Seque bem e passe um pouco de óleo vegetal em grelhas de ferro para evitar ferrugem.", "caut": ["Usar luvas: o bicarbonato com detergente resseca a pele.", "Fazer em local ventilado: a reação libera gás carbônico em quantidade pequena.", "Enxaguar muito bem — a grelha tem contato direto com a comida.", "Não usar em alumínio por muito tempo: escurece.", "Não usar com a grelha quente."], "err": ["Misturar o vinagre na pasta com antecedência — a reação acaba antes da aplicação.", "Deixar a grelha molhada depois de lavar — enferruja.", "Usar esponja de aço em grelha antiaderente — remove o revestimento.", "Esquecer de enxaguar — gosto estranho na carne."], "frag": "Sem perfume", "cor": "Branca", "emb": "Pote 500 g", "venda": "Churrasqueira e grelha limpas sem soda cáustica e sem esforço.", "custo": "Vende muito em épocas de churrasco (verão e finais de ano), com custo baixo.", "nivel": "Iniciante", "rend": "800 g por lote", "custoNum": "R$ 4,17/kg", "vendaNum": "R$ 20,00/kg", "margem": "379%"}, {"id": "fl138", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Água de Passar Caseira com Perfume de Lavanda", "desc": "Água perfumada de lavanda, borrifada nas roupas na hora de passar. Facilita o passar, reduz o amassado e perfuma a roupa de forma agradável.", "uses": ["Roupas passadas", "Lençóis e fronhas", "Toalhas", "Cortinas e panos de mesa"], "formula": [["Água", "4,4 L"], ["Álcool de cereais 92,8°", "500 ml"], ["Óleo essencial de lavanda", "20 ml"], ["Amaciante comum", "100 ml"]], "ingFunc": [["Álcool de cereais 92,8°", "Dissolve o óleo essencial e seca rápido, sem manchar."], ["Óleo essencial de lavanda", "Perfume natural de lavanda."], ["Amaciante comum", "Ajuda a soltar os fios e a reduzir o amassado ao passar."]], "prep": ["Higienize um frasco ou garrafão de 5 L com água quente e deixe escorrer.", "Em um copo de vidro, misture o óleo essencial de lavanda (20 ml) com o álcool de cereais (500 ml), mexendo até ficar transparente. O óleo essencial só se mistura bem no álcool.", "Coloque 4,4 L de água filtrada (de preferência fervida e fria) no garrafão.", "Despeje o amaciante (100 ml) e misture devagar, sem espuma.", "Acrescente a mistura de álcool e óleo essencial, mexendo suavemente.", "Deixe descansar por 24 horas, tampado, para o perfume se estabilizar.", "Envase em frascos spray de 250 ml a 500 ml e rotule com a data. Validade: 3 meses."], "dil": [["Uso direto", "Puro", "2 a 3 borrifadas na peça ao passar"], ["Roupas delicadas", "Puro", "Borrifar de longe, a 30 cm, e passar com ferro morno"]], "app": "Borrife de 2 a 3 vezes na peça, a uns 20 cm de distância, e passe o ferro. Em tecidos claros, borrife de longe. Guarde as roupas só depois que esfriarem.", "caut": ["Fazer teste em tecidos claros e delicados — alguns óleos essenciais podem manchar.", "Produto inflamável por causa do álcool: manter longe de chamas.", "Não borrifar sobre sedas.", "Não usar sobre pele.", "Manter fora do alcance de crianças."], "err": ["Colocar o óleo essencial direto na água — vira gotas e mancha a roupa.", "Excesso de amaciante — o ferro gruda no tecido.", "Usar água da torneira com muito cloro — pode manchar.", "Guardar sem tampa — o álcool evapora."], "frag": "Lavanda", "cor": "Transparente", "emb": "250 ml, 500 ml", "venda": "O cheirinho de roupa recém-passada de lavanda — feito em casa, com custo muito baixo.", "custo": "Produto de baixo custo e alta margem, ótimo para vender como complemento de sabão e amaciante.", "nivel": "Iniciante", "rend": "5 L por lote", "custoNum": "R$ 1,82/L", "vendaNum": "R$ 7,00/L", "margem": "285%"}, {"id": "fl139", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Detergente Caseiro Cremoso de Sabão de Coco e Glicerina", "desc": "Detergente de louça caseiro e cremoso, feito com sabão de coco derretido, glicerina e um toque de óleo essencial de limão. Rende bastante, limpa bem e é suave com as mãos.", "uses": ["Louças e panelas", "Talheres e copos", "Utensílios de cozinha", "Uso doméstico diário"], "formula": [["Água", "9,4 L"], ["Sabão de coco em barra ralado", "400 g"], ["Glicerina líquida", "100 ml"], ["Bicarbonato de sódio", "50 g"], ["Óleo essencial de limão", "10 ml"]], "ingFunc": [["Sabão de coco em barra ralado", "Base de limpeza: derretido na água quente, vira um detergente cremoso."], ["Glicerina líquida", "Suaviza o produto e protege as mãos do ressecamento."], ["Bicarbonato de sódio", "Ajuda a soltar gordura e a neutralizar odores."], ["Óleo essencial de limão", "Perfume fresco e ação desengordurante leve."]], "prep": ["Rale o sabão de coco bem fino (400 g, cerca de 2 barras de 200 g). Quanto mais fino, mais rápido derrete.", "Em uma panela grande, aqueça 5,7 L de água até quase ferver (85 a 90 °C), sem deixar ferver forte.", "Desligue o fogo, adicione o sabão ralado e mexa com colher de pau até derreter por completo, por cerca de 10 minutos.", "Acrescente o bicarbonato e misture. Vai espumar um pouco.", "Complete com o restante da água (3,7 L), fria, mexendo suavemente.", "Deixe esfriar por 12 horas, tampado. O produto engrossa e fica com consistência de gel.", "Quando estiver frio (abaixo de 35 °C), acrescente a glicerina e o óleo essencial, mexendo devagar para não formar espuma.", "Envase em garrafa com tampa de rosca, em potes de 500 ml. Agite antes de usar. Validade: 1 mês em local fresco (sem conservante)."], "dil": [["Uso direto", "Puro", "Algumas gotas na esponja"], ["Panelas gordurosas", "Puro", "Aplicar e deixar 5 minutos"], ["Rendimento", "1:2", "1 parte do produto + 2 partes de água"]], "app": "Coloque uma pequena quantidade na esponja úmida e lave a louça. Enxágue em água corrente. Agite o frasco antes de usar: se separar, é normal. Em louça muito engordurada, deixe de molho em água morna por 5 minutos.", "caut": ["Sem conservante: manter na geladeira ou em local fresco e usar em até 30 dias.", "Se mudar de cheiro ou cor, descartar.", "Fazer teste em copos de cristal.", "Não ingerir.", "Não misturar com água sanitária."], "err": ["Usar a água fervendo — a espuma transborda.", "Esquecer a glicerina — o produto resseca as mãos.", "Guardar por mais de 30 dias sem conservante — azeda.", "Colocar o óleo essencial a quente — evapora."], "frag": "Limão", "cor": "Transparente a levemente turvo", "emb": "Garrafa 500 ml", "venda": "Detergente caseiro, cremoso e perfumado com limão, a baixíssimo custo.", "custo": "Produto \"artesanal\" de baixo custo para vender em feiras e entre vizinhos.", "nivel": "Iniciante", "rend": "10 L por lote", "custoNum": "R$ 0,85/L", "vendaNum": "R$ 2,80/L", "margem": "231%"}, {"id": "fl140", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Limpa Cobre e Latão Caseiro (Vinagre, Sal e Farinha)", "desc": "Pasta caseira que devolve o brilho a panelas de cobre, objetos de latão e maçanetas. O vinagre dissolve o óxido, o sal ajuda como abrasivo suave e a farinha dá consistência de pasta.", "uses": ["Panelas de cobre", "Objetos de latão e bronze", "Maçanetas e torneiras antigas", "Utensílios decorativos"], "formula": [["Vinagre branco", "200 ml"], ["Sal fino", "4 colheres de sopa"], ["Farinha de trigo", "4 colheres de sopa"]], "ingFunc": [["Vinagre branco", "Ácido que dissolve o óxido (a camada esverdeada ou escura)."], ["Sal fino", "Abrasivo suave que ajuda a soltar a oxidação sem riscar."], ["Farinha de trigo", "Dá consistência à pasta, que fica no objeto durante a ação."]], "prep": ["Escolha uma tigela de vidro ou plástico (não use de metal).", "Coloque o sal e a farinha (4 colheres de sopa de cada, cerca de 100 g no total) na tigela e misture.", "Acrescente o vinagre aos poucos (200 ml), mexendo até formar uma pasta cremosa, tipo mingau grosso.", "Use a pasta imediatamente: ela não dura mais do que algumas horas.", "Descarte o que sobrar: não guarde a mistura."], "dil": [["Uso direto", "Puro", "Espalhar uma camada sobre a peça"], ["Oxidação forte", "Puro", "Deixar agir 20 a 30 minutos"]], "app": "Espalhe a pasta sobre a peça de cobre ou latão com um pano ou esponja macia. Deixe agir de 10 a 30 minutos. Esfregue levemente em movimentos circulares, enxágue com água morna e seque imediatamente com pano macio para dar brilho.", "caut": ["Não usar em peças laqueadas ou com verniz protetor — remove o acabamento.", "Enxaguar bem para tirar todo o ácido.", "Não usar em panela de cobre sem estanho na parte interna: se for cozinhar, a superfície interna deve ser estanhada ou inox.", "Fazer teste em canto escondido.", "Usar luvas se a pele for sensível."], "err": ["Deixar por horas na peça — pode escurecer e manchar.", "Não secar bem — a peça escurece de novo rapidamente.", "Esfregar com bucha dura — risca.", "Guardar a pasta para outro dia."], "frag": "Sem perfume", "cor": "Bege", "emb": "Conteúdo educativo", "venda": "Cobre e latão brilhando de novo com ingredientes de cozinha.", "custo": "Receita educativa de custo praticamente zero: ótima como bônus e para engajar o cliente.", "nivel": "Iniciante", "rend": "250 ml por preparo", "custoNum": "praticamente zero", "vendaNum": "Conteúdo educativo", "margem": "—"}, {"id": "fl141", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Pasta Limpa Tênis Branco Caseira (Bicarbonato, Detergente e Peróxido)", "desc": "Pasta para limpar e clarear tênis brancos de tecido, malha e solado de borracha. A base (bicarbonato, detergente e água) guarda bem; o peróxido de hidrogênio, que clareia, só é misturado na hora de usar.", "uses": ["Tênis brancos de tecido, lona e malha", "Solado e biqueira de borracha branca", "Cadarços brancos", "Sapatilhas e tênis de bebê (brancos)"], "formula": [["Bicarbonato de sódio", "300 g"], ["Detergente neutro de louça", "100 ml"], ["Peróxido de hidrogênio 10 volumes (água oxigenada)", "50 ml"], ["Água morna", "100 ml"]], "ingFunc": [["Bicarbonato de sódio", "Abrasivo bem suave: solta a sujeira do tecido sem esfolar e ajuda a neutralizar odores."], ["Detergente neutro de louça", "Remove a gordura e a sujeira de rua que prendem no tecido."], ["Peróxido de hidrogênio 10 volumes (água oxigenada)", "Clareia o amarelado e manchas, liberando oxigênio. Entra somente na hora de usar."]], "prep": ["Separe uma tigela de plástico de boca larga, colher de plástico, luvas e potes de plástico com tampa (5 potes de 150 ml). Não use tigela de metal.", "Coloque o bicarbonato na tigela (300 g, cerca de 15 colheres de sopa rasas).", "Junte a água morna (100 ml, cerca de 6 colheres de sopa), mexendo, e depois o detergente (100 ml, cerca de 6 colheres de sopa). Mexa devagar para não fazer espuma até formar uma pasta cremosa, espessa, parecida com pasta de dente.", "Divida essa BASE nos 5 potes (cerca de 100 g em cada). Tampe e rotule \"Base limpa tênis, sem peróxido\", com a data. A base dura 30 dias em local fresco.", "Guarde os 50 ml de peróxido separados, no frasco original (escuro), longe da luz. Reserve 10 ml (2 colheres de chá) para cada pote de base.", "Na hora de usar, misture 1 pote de base com 10 ml de peróxido em um copinho descartável, mexendo por 15 segundos. Use em até 1 hora: a mistura perde a força, porque o peróxido se decompõe rapidamente em contato com o bicarbonato."], "dil": [["Tênis branco de tecido ou malha", "Puro (pasta)", "Camada fina de 2 mm, 10 a 15 minutos"], ["Solado de borracha branco", "Puro (pasta)", "Esfregar 2 a 3 minutos com escova de dente"], ["Mancha amarelada antiga", "Puro (pasta)", "Deixar até 30 minutos, sem deixar secar completamente"], ["Só sujeira leve (sem clarear)", "Somente a base", "Sem peróxido, 5 minutos"]], "app": "Retire os cadarços e a palmilha. Tire o excesso de terra com escova seca. Espalhe a pasta com escova de dente macia ou escova de roupa, sempre no sentido da trama, e dê atenção às costuras. Deixe agir de 10 a 15 minutos (até 30 em manchas antigas). Esfregue levemente, retire a pasta com pano úmido limpo e enxágue em água corrente, mantendo a lingueta e o interior secos. Enxugue com toalha e deixe secar à sombra, em local ventilado, com papel toalha dentro do tênis.", "caut": ["Usar somente em tênis BRANCOS. O peróxido desbota cores, couro tingido, camurça e nobuck.", "Teste antes em um ponto escondido (parte interna da lingueta) por 5 minutos.", "Usar luvas: a mistura é levemente alcalina e resseca as mãos.", "Evitar contato com os olhos. Se acontecer, lavar com água corrente por 15 minutos.", "Secar à sombra: o sol forte com resíduo de peróxido pode amarelar o tecido.", "Não misturar com água sanitária.", "Manter fora do alcance de crianças."], "err": ["Misturar o peróxido na base inteira e guardar: ele se decompõe e a pasta perde o efeito.", "Deixar a pasta secar no tênis: forma uma crosta branca difícil de tirar.", "Encharcar o tênis: molha a espuma interna e demora a secar, causando mofo.", "Esfregar com bucha ou escova dura: desfia o tecido.", "Secar no sol ou no secador: amarela o tecido e deforma a borracha."], "frag": "Sem perfume", "cor": "Branco", "emb": "Pote de 110 g com frasquinho de peróxido", "venda": "Tênis branco de novo, com limpeza e clareamento sem lavar na máquina e sem estragar o calçado.", "custo": "Produto de venda recorrente: o kit pasta + peróxido vende bem para quem usa tênis branco todo dia.", "nivel": "Iniciante", "rend": "550 g (5 potes de 110 g)", "custoNum": "R$ 4,45/kg", "vendaNum": "R$ 24,00/kg", "margem": "439%"}, {"id": "fl142", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Pré-Lavagem Caseira Tira-Mancha de Gordura (Detergente e Bicarbonato)", "desc": "Pasta para aplicar em roupas e panos com mancha de gordura, óleo e comida antes de lavar. O detergente dissolve a gordura e o bicarbonato ajuda a soltá-la do tecido.", "uses": ["Golas e punhos engordurados", "Aventais e panos de cozinha", "Roupas com mancha de óleo, molho e gordura", "Uniformes de cozinha e oficina"], "formula": [["Detergente neutro de louça", "200 ml"], ["Bicarbonato de sódio", "200 g"], ["Água morna", "100 ml"]], "ingFunc": [["Detergente neutro de louça", "Principal ação desengordurante: quebra a gordura em pequenas gotas que a água leva embora."], ["Bicarbonato de sódio", "Alcaliniza levemente e ajuda a soltar a gordura do tecido, além de neutralizar odor."]], "prep": ["Separe uma tigela de plástico, colher de plástico, luvas e um pote de 500 ml com tampa. Lave e seque o pote.", "Coloque os 200 g de bicarbonato na tigela (cerca de 10 colheres de sopa rasas).", "Junte a água morna (100 ml, 6 colheres de sopa) e mexa até dissolver parte do bicarbonato e formar uma mistura rala.", "Adicione o detergente (200 ml, cerca de 13 colheres de sopa) aos poucos, misturando devagar, para a espuma não encher a tigela.", "Continue mexendo por 2 minutos até ficar um gel cremoso e uniforme, que não escorre da colher.", "Passe para o pote, tampe e deixe descansar por 1 hora. Rotule \"Pré-lavagem, não ingerir\" com a data. Validade: 30 dias."], "dil": [["Manchas de gordura frescas", "Puro", "Aplicar e deixar 10 minutos"], ["Manchas antigas ou golas", "Puro", "Esfregar e deixar 30 minutos"], ["Panos de cozinha muito engordurados", "1 colher de sopa por litro", "Deixar de molho 1 hora em água morna"]], "app": "Coloque a peça de roupa seca sobre uma superfície plana. Aplique uma camada de pasta sobre a mancha e esfregue levemente com o dedo ou uma escova de roupa macia. Deixe agir de 10 a 30 minutos. Lave normalmente na máquina ou à mão com sabão, na temperatura mais alta que o tecido aceitar. Confira se a mancha saiu antes de secar; se não saiu, repita a aplicação. Secar a peça com mancha fixa no calor fixa a gordura.", "caut": ["Fazer teste em área escondida do tecido antes, principalmente em peças coloridas e delicadas.", "Não usar em seda, lã e couro.", "Usar luvas se tiver a pele sensível.", "Não misturar com água sanitária.", "Manter fora do alcance de crianças e longe de alimentos."], "err": ["Passar a pasta e colocar na secadora sem lavar antes: a gordura fixa no tecido.", "Deixar a pasta secar sobre o tecido: pode deixar marca de resíduo.", "Usar detergente concentrado ou colorido sem testar: pode manchar tecido claro.", "Esfregar com escova dura."], "frag": "Detergente de louça", "cor": "Amarelo claro", "emb": "Pote 250 g, pote 500 g", "venda": "Tira gordura de colarinho, avental e pano de prato antes da lavagem — a mancha sai de primeira.", "custo": "Margem alta e uso diário: ótimo para vender a donas de casa, restaurantes e oficinas.", "nivel": "Iniciante", "rend": "500 g por lote (2 potes de 250 g)", "custoNum": "R$ 4,80/kg", "vendaNum": "R$ 20,00/kg", "margem": "317%"}, {"id": "fl143", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Aromatizante de Ambiente Caseiro (Álcool, Óleo Essencial e Glicerina)", "desc": "Spray perfumado para sala, quarto, cortinas, sofás e carros. O álcool carrega o perfume e evapora rápido, o óleo essencial perfuma e a glicerina fixa o aroma por mais tempo.", "uses": ["Sala e quarto", "Cortinas e sofás", "Interior de carros", "Roupas de cama e armários"], "formula": [["Água", "3,4 L"], ["Álcool de cereais ou etílico 96° GL", "1,5 L"], ["Óleo essencial (lavanda ou capim-limão)", "60 ml"], ["Glicerina líquida", "50 ml"]], "ingFunc": [["Álcool de cereais ou etílico 96° GL", "Dissolve o óleo essencial na água e faz o spray secar rápido."], ["Óleo essencial (lavanda ou capim-limão)", "Perfume e leve ação sobre odores."], ["Glicerina líquida", "Fixa o aroma, diminuindo a evaporação do perfume."]], "prep": ["Use luvas e trabalhe em local ventilado, longe de chama, fogão e cigarro: o álcool é inflamável. Separe um galão ou garrafão de 5 L limpo e seco.", "Em uma jarra, coloque o álcool (1,5 L) e junte o óleo essencial (60 ml, cerca de 4 colheres de sopa). Misture com colher de plástico até ficar translúcido: óleo essencial se dissolve melhor no álcool do que na água.", "Acrescente a glicerina (50 ml, cerca de 3 colheres de sopa) e misture por mais 1 minuto.", "Coloque os 3,4 L de água no galão e, aos poucos, despeje a mistura de álcool, mexendo bem. Não faça o contrário: ao colocar a água sobre o óleo, ele forma gotas que não se dissolvem.", "Tampe e agite com delicadeza por 2 minutos. É normal a mistura ficar levemente leitosa. Deixe descansar por 24 horas, para o perfume se unir à base.", "Envase em frascos com borrifador (250 ml ou 500 ml). Rotule \"Aromatizante, inflamável, não ingerir\" com a data. Validade: 6 meses."], "dil": [["Ambientes (spray)", "Puro", "3 a 5 borrifadas, a 1 metro de altura"], ["Tecidos (cortina, sofá)", "Puro", "Borrifar a 30 cm, sem encharcar"], ["Carro", "Puro", "2 a 3 borrifadas no carpete e nos bancos"]], "app": "Agite o frasco antes de usar. Borrifa o produto no ar, no centro do ambiente, a cerca de um metro de altura, ou em tecidos a 30 cm de distância, sem encharcar. Em tecidos, teste antes em um canto escondido. Reaplique a cada 4 a 6 horas.", "caut": ["Álcool é inflamável: não borrifar perto de chama, vela, fogão ou cigarro.", "Não borrifar direto em pessoas, animais, aquários e comida.", "Gatos e aves são sensíveis a óleos essenciais (como o de melaleuca e cítricos): evitar em ambientes onde ficam.", "Teste em tecidos delicados, couro e madeira envernizada: o álcool pode manchar.", "Pessoas com asma e rinite devem evitar ambientes muito perfumados.", "Manter fora do alcance de crianças."], "err": ["Usar óleo essencial puro sem álcool: não se mistura com a água e mancha tecidos.", "Usar álcool 70% (gel ou comum) no lugar do álcool de cereais: o óleo se separa.", "Frasco de vidro transparente: a luz estraga o óleo essencial.", "Exagerar na quantidade de perfume: enjoa e agride as vias respiratórias."], "frag": "Lavanda, capim-limão ou outro óleo essencial", "cor": "Transparente (levemente leitoso)", "emb": "Spray 250 ml, spray 500 ml", "venda": "Perfume natural para a casa inteira, com óleo essencial de verdade e sem aromatizante barato.", "custo": "Ótima margem em frascos de 250 ml. Venda como \"aromatizante natural\" (aromatizante de ambiente precisa de regularização na Anvisa).", "nivel": "Intermediário", "rend": "5 L por lote (20 frascos de 250 ml)", "custoNum": "R$ 5,19/L", "vendaNum": "R$ 16,00/L", "margem": "208%"}, {"id": "fl144", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Limpa Piso Caseiro de Vinagre e Capim-Limão", "desc": "Limpa piso de cerâmica e porcelanato que tira a sujeira e deixa um cheirinho fresco de capim-limão. O vinagre dá brilho e tira a película de sabão e o detergente limpa a gordura.", "uses": ["Piso cerâmico e porcelanato", "Azulejos de cozinha e banheiro", "Piso vinílico e laminado (com pouca água)", "Áreas de serviço"], "formula": [["Água", "7,8 L"], ["Vinagre branco", "2 L"], ["Capim-limão fresco (ou seco)", "100 g"], ["Detergente neutro de louça", "100 ml"]], "ingFunc": [["Vinagre branco", "Ácido leve: tira película de sabão e dá brilho ao piso."], ["Capim-limão fresco (ou seco)", "Perfuma de forma natural e dá cheiro de limpeza fresca."], ["Detergente neutro de louça", "Limpa a gordura e a sujeira do dia a dia."]], "prep": ["Lave bem o capim-limão em água corrente e pique em pedaços de 3 cm (100 g, cerca de 1 maço pequeno).", "Ferva 2 L de água em uma panela limpa, desligue o fogo, junte o capim-limão, tampe e deixe em infusão por 2 horas.", "Coe em uma peneira fina ou pano limpo, descartando o capim. Reserve o líquido.", "Em um galão de 10 L, junte o chá coado (cerca de 2 L) e mais 5,8 L de água em temperatura ambiente, completando os 7,8 L de água da fórmula.", "Adicione o vinagre (2 L) e o detergente (100 ml, cerca de 6 colheres de sopa), misturando devagar para não fazer espuma.", "Envase em garrafas com tampa e rotule \"Limpa piso, não ingerir\" com a data. Guarde em local fresco, longe do sol. Validade: 10 dias (produto natural, sem conservante)."], "dil": [["Limpeza do dia a dia", "Puro", "1 copo (200 ml) em 2 L de água"], ["Piso engordurado (cozinha)", "Puro", "1 copo e meio em 2 L de água morna"], ["Spray para manutenção", "Puro", "Borrifar e passar pano"]], "app": "Varra o piso para tirar a poeira. Dilua o produto no balde, na proporção de um copo (200 ml) para 2 L de água. Passe o pano torcido ou mop no piso, em seções de 2 m². Não precisa enxaguar. Em áreas de cozinha, use água morna. Deixe secar ao ar.", "caut": ["Não usar em mármore, granito, pedras naturais, cimento queimado e piso de ardósia: o ácido do vinagre opaca e corrói.", "Não usar em rejunte muito antigo ou solto: o ácido o desgasta.", "Não misturar com água sanitária: libera gás cloro, tóxico.", "Pisos de madeira e laminados: pano bem torcido, quase seco.", "Manter fora do alcance de crianças e animais."], "err": ["Guardar por mais de 10 dias: o capim fermenta e o produto azeda.", "Usar puro no piso: o vinagre sem diluição ataca o rejunte.", "Usar em piso de pedra: opaca o brilho.", "Misturar com sabão em pó ou sabão em barra: o vinagre neutraliza o sabão e perde efeito."], "frag": "Capim-limão", "cor": "Amarelo claro (cor do chá)", "emb": "Garrafa 1 L, galão 5 L", "venda": "Piso limpo com cheirinho natural de capim-limão, sem cheiro de vinagre depois de seco.", "custo": "Custo muito baixo e fácil de vender como produto \"natural\".", "nivel": "Iniciante", "rend": "10 L por lote", "custoNum": "R$ 0,91/L", "vendaNum": "R$ 3,50/L", "margem": "285%"}, {"id": "fl145", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Sabonete em Barra de Glicerina Perfumado (Derrete e Molda)", "desc": "Sabonete em barra feito com base de glicerina pronta, que só precisa ser derretida, colorida, perfumada e colocada em forma. Fácil, sem soda cáustica e com resultado profissional.", "uses": ["Sabonete para as mãos e o corpo", "Lembrancinhas e kits de presente", "Sabonete para visitas", "Venda em feiras e redes sociais"], "formula": [["Base de glicerina transparente ou branca (derrete e molda)", "1 kg"], ["Essência cosmética para sabonete", "20 ml"], ["Corante líquido para sabonete", "q.s."]], "ingFunc": [["Base de glicerina transparente ou branca (derrete e molda)", "Base do sabonete: já vem saponificada e pronta para derreter."], ["Essência cosmética para sabonete", "Perfume (2% da massa). Precisa ser própria para sabonete."], ["Corante líquido para sabonete", "Dá cor ao sabonete. Usar poucas gotas."]], "prep": ["Higienize as formas de silicone (12 cavidades de cerca de 80 g) com álcool 70% e deixe secar. Separe espátula de silicone, jarra de vidro ou plástico próprio para micro-ondas (2 L), borrifador com álcool 70% e filme PVC.", "Corte a base de glicerina (1 kg) em cubos de 2 cm. Quanto menores os cubos, mais rápido e uniforme é o derretimento.", "Coloque na jarra e leve ao micro-ondas em potência média por 30 segundos. Mexa com a espátula e repita em ciclos de 30 segundos até derreter toda a base (3 a 5 minutos). Se preferir, derreta em banho-maria. A temperatura ideal é de 60 a 65 °C. Nunca deixe ferver: a fervura queima a base, faz bolhas e deixa o sabonete quebradiço.", "Retire do calor, espere 1 minuto e pingue o corante, gota a gota, mexendo com cuidado. Comece com 3 a 4 gotas: a cor fica mais escura quando endurece.", "Quando a massa chegar a cerca de 55 °C (quente, mas dá para segurar a jarra), adicione a essência (20 ml, 2% da massa) e misture com delicadeza por 30 segundos, sem bater, para não fazer bolhas. A essência vai por último porque evapora com o calor.", "Borrife álcool 70% sobre a superfície para estourar as bolhas.", "Despeje nas formas de uma vez, com a jarra bem próxima à forma. Borrife o álcool de novo na superfície.", "Deixe endurecer de 1 a 2 horas em temperatura ambiente. Não use o freezer: o choque térmico racha e faz o sabonete suar. Se o desenforme estiver difícil, leve à geladeira por 15 minutos.", "Desenforme e embale na hora em filme PVC bem justo. A glicerina atrai umidade do ar e fica \"suada\" quando exposta. Aguarde 24 horas antes de usar ou vender. Validade: 12 meses."], "dil": [["Uso pessoal", "Puro", "Molhar as mãos e esfregar o sabonete"], ["Presente ou revenda", "Embalado", "Em filme PVC com rótulo e lote"]], "app": "Molhe as mãos ou o corpo, esfregue o sabonete até formar espuma e enxágue com água corrente. Mantenha em saboneteira com escoamento, para a barra secar entre os usos e durar mais.", "caut": ["Use essência própria para sabonete: aromatizante de ambiente e essência de vela irritam a pele.", "Não ultrapasse 3% de essência no total.", "A jarra e a massa quente queimam: use luvas térmicas.", "Não use o produto em quem tem alergia à fragrância.", "Para vender, é preciso regularizar na Anvisa (cosmético grau 1) e rotular com ingredientes (INCI) e lote.", "Mantenha longe de crianças pequenas (lembrancinha pode ser confundida com doce)."], "err": ["Ferver a base: queima, perde a transparência e racha.", "Colocar a essência com a base muito quente: ela evapora e fica sem perfume.", "Usar corante em excesso: mancha a pele e a toalha.", "Guardar sem embalar: o sabonete fica úmido (\"suando\") e pegajoso.", "Colocar no freezer: racha e perde o brilho."], "frag": "Floral, frutal, lavanda ou outro (essência para sabonete)", "cor": "Qualquer cor, em tom transparente ou leitoso", "emb": "Barra de 80 g em filme PVC, caixinha, kit com 3", "venda": "Sabonete artesanal de glicerina, macio e perfumado, que você faz em uma tarde.", "custo": "Ótimo para feiras e presentes. Lote de 12 barras com ótima margem.", "nivel": "Iniciante", "rend": "12 barras de cerca de 80 g", "custoNum": "R$ 2,38/barra", "vendaNum": "R$ 7,00/barra", "margem": "195%"}, {"id": "fl146", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Pó Desodorizante para Lixeira e Ralos (Bicarbonato, Argila e Óleo Essencial)", "desc": "Pó perfumado que neutraliza o mau cheiro de lixeiras, ralos, fundo de armários e calçados. O bicarbonato e a argila absorvem o odor, enquanto o óleo essencial deixa um cheiro fresco.", "uses": ["Fundo de lixeiras e cestos", "Ralos de pia, box e tanque", "Fundo de gavetas, armários e sapateiras", "Sapatos e tênis (em saquinho de tecido)"], "formula": [["Bicarbonato de sódio", "1 kg"], ["Argila branca (caulim)", "100 g"], ["Óleo essencial (lavanda, capim-limão ou eucalipto)", "30 ml"]], "ingFunc": [["Bicarbonato de sódio", "Neutraliza os odores ácidos do lixo e dos ralos."], ["Argila branca (caulim)", "Absorve umidade e odor e ajuda a espalhar o óleo no pó."], ["Óleo essencial (lavanda, capim-limão ou eucalipto)", "Dá o perfume e uma leve ação sobre odores."]], "prep": ["Use máscara e luvas descartáveis: o pó fino solta poeira. Separe uma bacia ampla e seca, colher grande e peneira.", "Coloque a argila (100 g) na bacia e pingue o óleo essencial (30 ml, cerca de 2 colheres de sopa), aos poucos, misturando com a colher. A argila absorve o óleo e evita que o pó empelote.", "Misture bem a argila perfumada até ficar um pó úmido e uniforme, sem grumos de óleo.", "Junte o bicarbonato (1 kg) em 3 etapas, misturando por 3 minutos a cada etapa, até o pó ficar de uma cor só.", "Passe na peneira fina para quebrar as bolinhas.", "Coloque o pó em um pote de vidro ou plástico com tampa e deixe 24 horas fechado para o perfume se espalhar. Mexa uma vez após esse tempo.", "Distribua em potes de 100 g ou 200 g com tampa. Rotule \"Desodorizante, não ingerir\" com a data. Validade: 12 meses em local seco."], "dil": [["Lixeira", "Puro", "1 colher de sopa no fundo, depois de colocar o saco"], ["Ralo", "Puro", "2 colheres de sopa, depois 1 copo de água quente"], ["Armário e gaveta", "Puro", "Potinho aberto com 2 colheres"]], "app": "Em lixeiras, polvilhe uma colher de sopa no fundo de lixeira limpa e seca, antes de colocar o saco. Em ralos, espalhe duas colheres de sopa e jogue um copo de água quente para ajudar a agir. Em gavetas e sapateiras, deixe um potinho aberto e troque a cada 30 dias.", "caut": ["Não usar o pó no lugar de higiene: não substitui a limpeza do ralo e da lixeira.", "Óleo essencial em excesso pode ser tóxico para gatos e cães: não use em ambientes de animais.", "Não misturar com água sanitária nem com ácidos dentro do ralo.", "Guardar sempre fechado: o pó empedra com a umidade.", "Manter fora do alcance de crianças."], "err": ["Colocar o óleo direto no bicarbonato: forma bolinhas e o cheiro fica concentrado em pontos.", "Guardar em pote aberto: o perfume evapora e o pó empedra.", "Usar em lixeira molhada: o pó vira uma pasta.", "Usar óleo essencial barato e sintético: perde o perfume em poucos dias."], "frag": "Lavanda, capim-limão ou eucalipto", "cor": "Branco", "emb": "Pote 100 g, pote 200 g, saquinho 50 g", "venda": "Fim do mau cheiro da lixeira e do ralo, com um pó natural que custa centavos por uso.", "custo": "Boa margem e fácil de embalar em saquinhos e potes.", "nivel": "Iniciante", "rend": "1,13 kg por lote", "custoNum": "R$ 12,12/kg", "vendaNum": "R$ 38,00/kg", "margem": "213%"}, {"id": "fl147", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Sabão em Pasta Cremoso Caseiro (Sabão em Barra e Glicerina)", "desc": "Sabão pastoso, macio e fácil de aplicar, feito com sabão em barra ralado e dissolvido em água. A glicerina deixa a pasta cremosa e protege as mãos, e o bicarbonato ajuda na limpeza e a neutralizar odores.", "uses": ["Panelas e frigideiras", "Louças muito sujas", "Tanque e roupas muito sujas", "Fogão e coifa"], "formula": [["Água", "1,1 L"], ["Sabão em barra comum (glicerinado ou neutro)", "300 g"], ["Glicerina líquida", "50 ml"], ["Bicarbonato de sódio", "30 g"]], "ingFunc": [["Sabão em barra comum (glicerinado ou neutro)", "Limpeza principal: é ele que desengordura e forma a espuma."], ["Glicerina líquida", "Deixa a pasta macia e cremosa, e protege as mãos."], ["Bicarbonato de sódio", "Ajuda a soltar sujeira e neutraliza odores."]], "prep": ["Rale o sabão (300 g, cerca de 3 barras de 100 g) no ralador de lado grosso, ou pique com a faca em lascas finas. Quanto menor, mais rápido derrete.", "Em uma panela grande de inox ou alumínio, aqueça 1,1 L de água até ficar bem quente, mas sem ferver (cerca de 80 °C, com vapor saindo).", "Desligue o fogo e junte o sabão ralado, mexendo com colher de pau por 5 minutos. Se necessário, volte ao fogo baixo por 5 minutos, mexendo sempre, sem deixar ferver (para não transbordar).", "Quando todo o sabão estiver dissolvido e a mistura estiver lisa, desligue o fogo e acrescente a glicerina (50 ml, 3 colheres de sopa) e o bicarbonato (30 g, 2 colheres de sopa), mexendo. Aparecerá um pouco de espuma, que é normal.", "Deixe esfriar tampado por 12 a 24 horas, sem mexer. A mistura vai engrossar e virar um gel.", "Depois de frio, bata com uma colher ou fouet por 1 minuto, para ficar cremoso. Se estiver muito firme, acrescente 50 ml de água morna e mexa; se estiver muito mole, deixe mais um dia descansar.", "Coloque em potes plásticos com tampa (500 g ou 1 kg) e rotule com a data. Validade: 90 dias em local fresco."], "dil": [["Panelas e louça", "Puro", "Uma colher de sopa na esponja"], ["Roupas e tanque", "Puro", "Uma colher de sopa em 2 L de água"], ["Fogão e coifa", "Puro", "Passar com esponja úmida, deixar 10 minutos"]], "app": "Pegue uma pequena quantidade (1 colher de sopa) com a esponja úmida. Esfregue sobre a superfície, deixe agir de 5 a 10 minutos em sujeiras mais difíceis e enxágue com água. Em roupas, passe a pasta sobre as manchas, deixe agir por 15 minutos e lave normalmente.", "caut": ["Usar luvas se tiver pele sensível.", "Evitar contato com os olhos.", "Não usar em alumínio por muito tempo, pois escurece.", "Não misturar com água sanitária.", "Manter fora do alcance de crianças."], "err": ["Ferver o sabão: a espuma sobe e transborda.", "Usar sabão em barra com muito perfume: o cheiro fica forte demais.", "Mexer enquanto resfria: a pasta fica granulada.", "Guardar em pote aberto: ressecca.", "Exagerar na água: a pasta não firma."], "frag": "Sem perfume ou perfumado levemente (opcional)", "cor": "Branco ou amarelo claro", "emb": "Pote 500 g, pote 1 kg", "venda": "Pasta que rende muito, limpa gordura pesada e custa uma fração dos produtos de loja.", "custo": "Alto rendimento: cada kg rende dezenas de usos.", "nivel": "Iniciante", "rend": "1,5 kg por lote", "custoNum": "R$ 2,80/kg", "vendaNum": "R$ 12,00/kg", "margem": "329%"}, {"id": "fl148", "cat": "receitas-caseiras", "catName": "Receitas Caseiras/Tradicionais", "catIcon": "🌿", "title": "Limpa Ferrugem Caseiro de Limão e Sal (Ferramentas)", "desc": "Pasta de limão e sal para tirar ferrugem superficial de ferramentas, facas, tesouras, alicates e parafusos. O ácido do limão dissolve a ferrugem e o sal ajuda a soltar a camada de óxido.", "uses": ["Ferramentas manuais (alicate, chave, martelo)", "Facas e tesouras com ferrugem leve", "Parafusos e porcas", "Grades e peças pequenas"], "formula": [["Sal grosso moído", "5 colheres de sopa"], ["Suco de limão (coado)", "5 colheres de sopa"]], "ingFunc": [["Sal grosso moído", "Abrasivo suave e eletrólito que acelera a ação do ácido."], ["Suco de limão (coado)", "Ácido cítrico que dissolve a ferrugem."]], "prep": ["Esprema o limão (cerca de 2 limões grandes) e coe o suco para tirar sementes e polpa.", "Moa o sal grosso no pilão ou liquidificador (5 colheres de sopa, cerca de 75 g) até ficar fino, como areia.", "Em um pires, misture o sal e o suco de limão (5 colheres de sopa, cerca de 75 ml) com uma colher de plástico até formar uma pasta úmida e espessa.", "Use na hora: o limão perde o efeito em poucas horas e a pasta resseca."], "dil": [["Uso direto", "Puro (pasta)", "Camada de 3 mm sobre a ferrugem"], ["Ferrugem leve", "Puro", "Deixar agir 1 a 2 horas"], ["Ferrugem mais forte", "Puro", "Deixar até 4 horas, renovando a pasta"]], "app": "Limpe a peça de graxa e terra com água e sabão, e seque. Espalhe a pasta sobre a ferrugem, cobrindo toda a área. Deixe agir de 1 a 2 horas, à sombra. Esfregue com escova de cerdas de nylon ou bucha de cozinha, enxágue com água corrente e seque IMEDIATAMENTE com pano. Em seguida passe uma fina camada de óleo (óleo mineral ou de máquina) para proteger a peça de nova ferrugem.", "caut": ["Funciona apenas em ferrugem superficial; ferrugem profunda exige tratamento com lixa ou produto específico.", "Usar luvas: o sal e o ácido irritam cortes e ferimentos.", "Não usar em peças cromadas ou com pintura: o ácido remove o acabamento.", "Não deixar de um dia para o outro: o ácido e o sal acabam por enferrujar mais.", "Secar muito bem depois: a umidade volta a gerar ferrugem.", "Cuidado com as pontas de facas e tesouras."], "err": ["Deixar a pasta por muitas horas ou de um di  ["Misture água e o tensoativo.", "Adicione o quaternário, mexa por 5 minutos.", "Acrescente o álcool.", "Finalize com fragrância e conservante."], "dil": [["Uso direto", "Puro", "Aplicar via spray nebulizador no sistema"]], "app": "Com o veículo ligado e ar-condicionado no máximo, nebulize o produto na entrada de ar externa conforme instrução do aplicador, mantendo o sistema ligado por alguns minutos.", "caut": ["Seguir instruções do aplicador nebulizador específico.", "Não usar em ambiente fechado sem ventilação durante a aplicação.", "Aplicar com o veículo desocupado e janelas abertas; não pulverizar sobre componentes elétricos."], "err": ["Aplicar sem o ar-condicionado ligado — o produto não circula pelo sistema corretamente."], "frag": "Frescor, eucalipto", "cor": "Transparente", "emb": "250 ml (com aplicador nebulizador)", "venda": "Elimina o cheiro de mofo do ar-condicionado — ar mais limpo e saudável dentro do carro.", "custo": "Serviço/produto de alta demanda sazonal (início do uso do ar-condicionado) com bom ticket.", "nivel": "Avançado", "rend": "100 L", "custoNum": "R$ 1,10/L", "vendaNum": "R$ 8,80/L", "margem": "700%"}, {"id": "oa029", "cat": "limpeza-interna", "catName": "Limpeza Interna", "catIcon": "🚗", "title": "Limpa Motor Desengraxante", "desc": "Remove graxa, óleo e sujeira acumulada no compartimento do motor com segurança para componentes elétricos (uso correto).", "uses": ["Compartimento do motor", "Peças metálicas engraxadas"], "formula": [["Água", "69,3 L"], ["Tensoativo aniônico (LESS 27%)", "14 L"], ["Hidrotropo (xilenosulfonato de sódio)", "3 L"], ["Soda barrilha", "4 kg"], ["d-Limoneno", "5 L"], ["Tensoativo não iônico (NI-9)", "4 L"], ["Fragrância", "500 ml"], ["Conservante", "200 ml"]], "ingFunc": [["Soda barrilha + d-Limoneno", "Combinação forte que dissolve graxa e óleo automotivo pesado."]], "prep": ["Dissolva a soda barrilha em água morna à parte.", "Adicione ao restante da água.", "Acrescente o tensoativo devagar.", "Adicione o d-L de envasar."], "dil": [["Uso em difusor (puro)", "Puro", "Refil de difusor de ventilação"], ["Spray para borrifar no interior", "1:2", "1 parte produto para 2 de água"]], "app": "Use puro em refil de difusor de saída de ar, ou dilua e borrife levemente em estofados e carpetes (evitar excesso em tecidos claros).", "caut": ["Manter longe de chamas — contém álcool.", "Testar em área escondida antes de borrifar diluído em tecido claro."], "err": ["Usar essência de baixa qualidade — perde a fixação rapidamente no calor do carro."], "frag": "Carro novo, madeira, cítrica, floral, gourmet", "cor": "À escolha", "emb": "30 ml (refil difusor), 250 ml (spray)", "venda": "O perfume automotivo de alta fixação que dura semanas — a assinatura olfativa do seu carro.", "custo": "Produto de recompra mensal fiel e alto ticket por mililitro — ótima margem em refil pequeno.", "nivel": "Intermediário", "rend": "100 L", "custoNum": "R$ 1,40/L", "vendaNum": "R$ 11,00/L", "margem": "686%"}];
const LG=[{"id": "lg01", "num": "1", "title": "Os 3 Caminhos para Começar", "icon": "🛣️", "desc": "Revenda, marca própria terceirizada e fabricação própria — vantagens, limitações e como escolher para o seu momento atual.", "content": "Os três modelos de negócio para quem quer vender produtos de limpeza e automotivos:\n\n1. REVENDA — O mais fácil. Você compra produtos prontos de um fabricante e revende com a sua marca ou a dele. Menor custo de entrada, sem estrutura de produção, mas margens menores e dependência do fornecedor.\n\n2. MARCA PRÓPRIA TERCEIRIZADA — O intermediário. Você contrata um fabricante para produzir com a sua marca. Você é o responsável legal pelo produto, mas não produz fisicamente. Precisa de CNPJ, regularização e contrato com o fabricante.\n\n3. FABRICAÇÃO PRÓPRIA — O mais completo. Você produz tudo. Maior controle de qualidade e melhores margens, mas exige infraestrutura, regularização completa e possivelmente um Responsável Técnico.\n\n💡 Recomendação: comece com revenda ou marca terceirizada para validar o mercado antes de investir em estrutura própria."}, {"id": "lg02", "num": "2", "title": "Venda Antes de Fabricar", "icon": "💡", "desc": "Como validar o produto e começar a vender antes de montar toda a estrutura legal — a estratégia mais inteligente.", "content": "A sequência certa para quem está começando:\n\n1. Teste o produto com sua rede — amigos, família, conhecidos próximos\n2. Colete feedback honesto sobre qualidade, perfume e embalagem\n3. Valide se as pessoas pagariam o preço que você precisa cobrar\n4. Com feedback positivo e primeiras vendas, invista na formalização\n5. Abra o MEI ou ME — processo simples e rápido\n6. Regularize os produtos conforme escala a produção\n\n⚠️ Você pode vender para pessoas físicas como PF por um período curto enquanto regulariza. Não emita nota fiscal sem CNPJ e não venda para CNPJ sem nota.\n\nO erro mais comum: montar toda a estrutura legal e de produção ANTES de validar se o produto vende. Isso gera custos e frustração desnecessários."}, {"id": "lg03", "num": "3", "title": "O Que Você Pode Vender", "icon": "📋", "desc": "Saneantes Risco 1 e Risco 2 — o que cada categoria significa na prática e quais produtos são indicados para iniciar.", "content": "Produtos de limpeza e automotivos são regulados pela ANVISA como saneantes. Há dois níveis:\n\nRISCO 1 — Notificação (mais simples):\n• Sabão líquido e em pó\n• Detergente e lava-louças\n• Amaciante e alvejante sem cloro e sem alegação bactericida\n• Shampoo automotivo, limpa vidros e limpadores neutros (confirme na VISA local o enquadramento dos automotivos)\n• Limpa vidros, multiuso, limpa piso\n• Aromatizantes e desodorizadores\n\nRISCO 2 — Registro (mais complexo):\n• Desinfetantes e qualquer produto com alegação bactericida/antimicrobiana\n• Água sanitária e alvejantes à base de hipoclorito (cloro ativo 2,0 a 2,5% p/p)\n• Produtos com pH < 2 ou > 11,5 (ácidos e álcalis fortes)\n• Inseticidas, repelentes e raticidas\n\nConfirme sempre o enquadramento do seu produto na RDC 59/2010 e RDC 40/2008 ou com a VISA local.\n\n✅ Recomendação para iniciantes: Comece com Risco 1. São mais fáceis de regularizar, cobrem a maioria dos produtos do guia e têm mercado enorme."}, {"id": "lg04", "num": "4", "title": "Notificação ANVISA Passo a Passo", "icon": "📝", "desc": "11 passos detalhados para notificar seu produto no sistema Solicita — do cadastro ao protocolo final.", "content": "O processo de notificação de saneantes Risco 1 no sistema Solicita:\n\n1. Abra uma empresa (MEI ou ME) — CNPJ é obrigatório\n2. Acesse solicita.anvisa.gov.br e crie seu cadastro com CNPJ\n3. Escolha a opção Saneante → Notificação → Risco 1\n4. Preencha os dados do produto: nome comercial, composição (ingredientes), finalidade e modo de usar\n5. Informe os dados do fabricante: CNPJ, endereço completo\n6. Adicione o rótulo do produto (PDF) — deve ter todas as informações obrigatórias\n7. Pague a GRU (taxa ANVISA) — valor varia por categoria e porte. MEI tem redução\n8. Protocole e aguarde a análise (30 a 60 dias úteis para Risco 1)\n9. Receba o número de notificação por e-mail\n10. Inclua o número de notificação no rótulo de todos os lotes\n11. Guarde toda a documentação — laudos, fichas técnicas e comprovantes\n\n💡 A notificação não é permanente — tem prazo de validade. Acompanhe pelo sistema."}, {"id": "lg05", "num": "5", "title": "Rótulo Certo desde o Início", "icon": "🏷️", "desc": "Informações obrigatórias, erros mais comuns em fiscalização e checklist completo para não ser autuado.", "content": "O rótulo é o documento mais fiscalizado. Um rótulo errado gera autuação mesmo com produto regularizado.\n\nINFORMAÇÕES OBRIGATÓRIAS:\n✅ Nome do produto e marca\n✅ Número de notificação ou registro ANVISA (ex: Notificação ANVISA nº XXXXXXXXX)\n✅ CNPJ e endereço completo do fabricante/responsável\n✅ Composição completa (todos os ingredientes)\n✅ Finalidade de uso (para que serve)\n✅ Modo de usar (como aplicar)\n✅ Precauções e avisos de segurança\n✅ Capacidade do conteúdo (volume em ml ou peso em g)\n✅ Número de lote\n✅ Data de fabricação\n✅ Validade ou prazo de validade\n✅ Frases de segurança quando aplicável\n\nERROS MAIS COMUNS:\n❌ Falta o número de notificação ANVISA\n❌ Composição incompleta ou com nomes errados\n❌ Não tem data de fabricação ou validade\n❌ Informações de contato erradas ou desatualizadas"}, {"id": "lg06", "num": "6", "title": "Responsável Técnico", "icon": "👨‍🔬", "desc": "Quando você precisa de RT, quando não precisa e as opções para quem está começando.", "content": "O Responsável Técnico (RT) é um profissional habilitado (químico, farmacêutico, engenheiro químico ou biólogo) que assina a responsabilidade técnica pelos produtos.\n\nQUANDO É OBRIGATÓRIO:\n• Produtos de Risco 2 (registrados)\n• Empresas com AFE (Autorização de Funcionamento)\n• Produção em escala industrial\n• Exportação de produtos\n\nQUANDO GERALMENTE NÃO É OBRIGATÓRIO:\n• Produtos de Risco 1 notificados por MEI\n• Pequena produção artesanal\n• Revendedores de produtos já regularizados\n\nOPÇÕES PARA NÃO CONTRATAR FIXO:\n• RT por prestação de serviços (freela) — muitos profissionais atendem PMEs por projeto ou mensalidade\n• Parceria com laboratório que já tem RT\n• Contratar a produção de um terceirista que tem RT\n\n💡 Contrate o RT somente quando realmente necessário — é um custo fixo relevante para quem está começando."}, {"id": "lg07", "num": "7", "title": "Abrindo Sua Empresa", "icon": "🏢", "desc": "MEI, ME ou EPP — qual abrir, CNAEs corretos e passo a passo de abertura sem complicação.", "content": "MEI (Microempreendedor Individual):\n• Limite: R$ 81.000/ano (R$ 6.750/mês)\n• Tributação: valor fixo mensal baixo\n• Abertura: portal.gov.br/mei — grátis e em minutos\n• Ideal para: quem está validando o negócio\n\nME (Microempresa):\n• Limite: R$ 360.000/ano\n• Tributação: Simples Nacional\n• Ideal para: quem já vende bem e precisa de nota fiscal para CNPJ\n\nCNAE CORRETOS para fabricação de limpeza:\n• 20.61-4/00 — Fabricação de sabões e detergentes sintéticos\n• 20.62-2/00 — Fabricação de produtos de limpeza e polimento\n• 46.49-4/99 — Comércio atacadista de produtos de higiene e limpeza\n• 47.72-5/00 — Comércio varejista de cosméticos e higiene\n\nPASSO A PASSO MEI:\n1. Acesse gov.br/mei\n2. Informe CPF e data de nascimento\n3. Selecione a atividade (CNAE)\n4. Preencha os dados e emita o CCMEI\n5. Abra conta bancária PJ\n6. Instale o aplicativo MEI para emitir notas"}, {"id": "lg08", "num": "8", "title": "Licença Sanitária e AFE", "icon": "📜", "desc": "Quem precisa, como obter e o que muda por estado e município.", "content": "LICENÇA SANITÁRIA:\n• Emitida pela Vigilância Sanitária municipal ou estadual\n• Necessária para todo estabelecimento que produz, armazena ou distribui produtos regulados\n• Processo varia por município — consulte a VISA local\n• Prazo: geralmente 30 a 90 dias após vistoria\n• Renovação anual ou conforme prazo do estado\n\nAFE — AUTORIZAÇÃO DE FUNCIONAMENTO DE EMPRESA:\n• Emitida pela ANVISA via sistema Solicita\n• Obrigatória para fabricantes e importadores de saneantes\n• Necessita de RT fixo para emissão\n• Não é necessária para revendedores ou terceirizados\n\nALVARÁ DE FUNCIONAMENTO:\n• Emitido pela prefeitura municipal\n• Necessário para toda empresa com atividade comercial\n• Geralmente obtido junto com o registro municipal\n\nSEQUÊNCIA RECOMENDADA:\n1. CNPJ (MEI/ME)\n2. Alvará de funcionamento (prefeitura)\n3. Licença sanitária (VISA local)\n4. AFE da ANVISA (quando obrigatória)\n5. Notificação dos produtos"}, {"id": "lg09", "num": "9", "title": "Checklist Final e Plano de 30 Dias", "icon": "✅", "desc": "3 checklists por modelo de negócio + plano de ação semana a semana para sair do zero ao legal.", "content": "PLANO DE 30 DIAS:\n\nSemana 1 — VALIDAR:\n☐ Produza amostras dos seus 3 a 5 primeiros produtos\n☐ Distribua para 10 a 20 pessoas da sua rede\n☐ Colete feedback sincero sobre qualidade e preço\n☐ Defina o modelo de negócio (revenda, terceirizado ou próprio)\n\nSemana 2 — FORMALIZAR:\n☐ Abra o MEI em portal.gov.br/mei (gratuito)\n☐ Escolha os CNAEs corretos para a sua atividade\n☐ Abra conta bancária PJ\n☐ Instale o app MEI para emissão de notas\n\nSemana 3 — REGULARIZAR:\n☐ Crie os rótulos com todas as informações obrigatórias\n☐ Monte as fichas técnicas de cada produto\n☐ Solicite a licença sanitária na VISA local\n☐ Inicie as notificações ANVISA pelo Solicita\n\nSemana 4 — LANÇAR:\n☐ Defina preços e margens (use a Calculadora de Lucro)\n☐ Crie as embalagens finais\n☐ Divulgue nos grupos e redes sociais\n☐ Comece a vender com nota fiscal\n\n💡 Dica final: Perfeito é inimigo do bom. Comece vendendo e vá regularizando no processo. O importante é começar."}];
