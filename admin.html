<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0F0A">
<link rel="manifest" href="/admin.webmanifest">
<link rel="icon" href="/admin-icon-192.png">
<link rel="apple-touch-icon" href="/admin-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Adm Limpeza">
<title>Admin — Fábrica da Limpeza</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0e12;color:#e8edf2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
.box{max-width:460px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}
.sub{color:#8b949e;font-size:13px;margin:0 0 18px}
label{display:block;font-size:12px;color:#8b949e;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2f38;background:#111418;color:#fff;font-size:15px}
.prods{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.prod{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #2a2f38;border-radius:10px;background:#111418;font-size:14px}
.prod input{width:20px;height:20px}
.row{display:flex;gap:10px;margin-top:18px}
button{flex:1;padding:14px;border-radius:10px;border:0;font-size:15px;font-weight:700;cursor:pointer}
.b1{background:#2a2f38;color:#e8edf2}
.b2{background:#3fb950;color:#04130a}
pre{background:#111418;border:1px solid #2a2f38;border-radius:10px;padding:12px;font-size:12px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.msg{margin-top:16px;padding:12px;border-radius:10px;font-size:14px}
.ok{background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.4)}
.err{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.4)}
</style>
</head>
<body>
<div class="box">
  <h1>Liberar acesso — Fábrica da Limpeza</h1>
  <p class="sub">Grava direto no banco. Use quando o n8n falhar.</p>

  <label for="key">Senha admin</label>
  <input type="password" id="key" autocomplete="current-password">

  <label for="email">E-mail do cliente</label>
  <input type="email" id="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="cliente@email.com">

  <label for="nome">Nome (opcional)</label>
  <input type="text" id="nome" placeholder="Cliente">

  <label>Produtos</label>
  <div class="prods" id="prods"></div>

  <div class="row">
    <button class="b1" id="btnC">Consultar</button>
    <button class="b2" id="btnS">Liberar / salvar</button>
  </div>

  <div id="out"></div>
</div>

<script>
var PRODUTOS = [{"k": "base", "n": "Fábrica da Limpeza (base)"}, {"k": "limp", "n": "Ouro Automotivo (limp)"}, {"k": "leg", "n": "Guia de Legalização (leg)"}, {"k": "form", "n": "Fórmula Personalizada (form)"}, {"k": "perf", "n": "Perfumes de Casa de Rico (perf)"}];
var prods = document.getElementById('prods');
PRODUTOS.forEach(function(p){
  var d = document.createElement('label');
  d.className = 'prod';
  d.style.cssText = 'text-transform:none;letter-spacing:0;color:#e8edf2;font-size:14px;margin:0';
  d.innerHTML = '<input type="checkbox" data-p="'+p.k+'"> '+p.n;
  prods.appendChild(d);
});

var keyEl = document.getElementById('key');
try { keyEl.value = sessionStorage.getItem('adm_key') || ''; } catch(e){}

function show(cls, html){ document.getElementById('out').innerHTML = '<div class="msg '+cls+'">'+html+'</div>'; }
function esc(s){ return String(s).replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

function marcar(c){
  document.querySelectorAll('[data-p]').forEach(function(i){ i.checked = !!(c && c[i.getAttribute('data-p')]); });
}

async function chamar(acao){
  var email = document.getElementById('email').value.trim();
  if(!email){ show('err','Digite o e-mail.'); return; }
  if(!keyEl.value){ show('err','Digite a senha admin.'); return; }
  try { sessionStorage.setItem('adm_key', keyEl.value); } catch(e){}
  var produtos = {};
  document.querySelectorAll('[data-p]').forEach(function(i){ produtos[i.getAttribute('data-p')] = i.checked; });
  show('ok','Aguarde...');
  try{
    var r = await fetch('/api/admin-liberar', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-admin-key':keyEl.value},
      body: JSON.stringify({acao:acao, email:email, nome:document.getElementById('nome').value.trim(), produtos:produtos})
    });
    var d = await r.json();
    if(!d.ok){ show('err', esc(d.error||'Erro')); return; }
    if(acao==='consultar'){
      if(!d.existe){ marcar(null); show('err','Esse e-mail ainda não está cadastrado. Marque os produtos e clique em Liberar.'); return; }
      marcar(d.cliente);
      show('ok','Cadastro encontrado:<pre>'+esc(JSON.stringify(d.cliente,null,2))+'</pre>');
    } else {
      marcar(d.cliente);
      show('ok','✅ Gravado no banco:<pre>'+esc(JSON.stringify(d.cliente,null,2))+'</pre>');
    }
  }catch(e){ show('err','Falha de conexão: '+esc(e.message)); }
}
document.getElementById('btnC').onclick = function(){ chamar('consultar'); };
document.getElementById('btnS').onclick = function(){ chamar('salvar'); };
if('serviceWorker' in navigator){navigator.serviceWorker.register('/admin-sw.js',{scope:'/admin.html'}).catch(function(){});}
</script>
</body>
</html>
